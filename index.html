<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Knowledge Base</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #FAF7F0;
            --surface: #FFF;
            --sage: #8B9D83;
            --sage-dark: #6B7D63;
            --coral: #E39774;
            --coral-dark: #D17854;
            --text: #2C2C2C;
            --text-light: #666;
            --border: #DDD;
            --shadow: rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg: #1a1a1a;
            --surface: #2d2d2d;
            --text: #e0e0e0;
            --text-light: #a0a0a0;
            --border: #444;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
        }

        /* Header */
        header {
            background: var(--surface);
            border-bottom: 2px solid var(--sage);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--sage-dark);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .dark-mode-toggle {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        /* Navigation */
        nav {
            background: var(--surface);
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        .nav-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            color: var(--sage-dark);
        }

        .nav-btn.active {
            color: var(--sage-dark);
            border-bottom-color: var(--coral);
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Buttons */
        button, .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--sage);
            color: var(--surface);
        }

        .btn-primary:hover {
            background: var(--sage-dark);
        }

        .btn-secondary {
            background: var(--coral);
            color: var(--surface);
        }

        .btn-secondary:hover {
            background: var(--coral-dark);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--sage);
            color: var(--sage-dark);
        }

        .btn-outline:hover {
            background: var(--sage);
            color: var(--surface);
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .card-clickable {
            cursor: pointer;
        }

        /* Daily Capture */
        .daily-capture {
            background: linear-gradient(135deg, var(--sage) 0%, var(--coral) 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .daily-capture h2 {
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        .daily-capture p {
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        /* Note Card */
        .note-card {
            position: relative;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
            gap: 1rem;
        }

        .note-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .note-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 0.75rem;
        }

        .note-type {
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .type-insight { background: #E8F4F8; color: #0078A0; }
        .type-learning { background: #FFF4E6; color: #E07C00; }
        .type-idea { background: #F3E8FF; color: #7C3AED; }
        .type-decision { background: #D1FAE5; color: #059669; }
        .type-reference { background: #FEE2E2; color: #DC2626; }
        .type-question { background: #FEF3C7; color: #D97706; }
        .type-quote { background: #FCE7F3; color: #DB2777; }
        .type-resource { background: #DBEAFE; color: #2563EB; }

        .note-content {
            color: var(--text);
            margin-bottom: 0.75rem;
            line-height: 1.7;
        }

        .note-content-preview {
            max-height: 100px;
            overflow: hidden;
            position: relative;
        }

        .note-content-preview::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, var(--surface));
        }

        /* Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .tag {
            padding: 0.3rem 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag:hover {
            background: var(--sage);
            color: white;
            border-color: var(--sage);
        }

        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            min-height: 44px;
            background: var(--surface);
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.8rem;
            background: var(--sage);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .tag-remove {
            cursor: pointer;
            font-weight: bold;
        }

        .tag-input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 120px;
            font-size: 0.9rem;
            background: transparent;
            color: var(--text);
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
        }

        textarea {
            min-height: 300px;
            resize: vertical;
            font-family: 'Courier New', monospace;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(139, 157, 131, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--sage);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.5rem;
            top: 0.5rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--coral);
            border: 2px solid var(--surface);
            box-shadow: 0 0 0 2px var(--coral);
        }

        .timeline-date {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        /* Tag Cloud */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .cloud-tag {
            padding: 0.5rem 1rem;
            background: var(--surface);
            border: 1px solid var(--sage);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cloud-tag:hover {
            background: var(--sage);
            color: white;
            transform: scale(1.05);
        }

        /* Related Notes */
        .related-notes {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid var(--bg);
        }

        .related-note-item {
            padding: 1rem;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .related-note-item:hover {
            background: var(--border);
        }

        /* Pattern Alert */
        .pattern-alert {
            background: #FFF4E6;
            border-left: 4px solid #E07C00;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
        }

        body.dark-mode .pattern-alert {
            background: #3a2d1f;
        }

        .pattern-alert-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #E07C00;
        }

        /* Lists */
        .list-item {
            background: var(--surface);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--coral);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            background: var(--coral-dark);
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            padding: 1rem;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 2rem;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        /* Markdown Preview */
        .markdown-preview {
            padding: 1rem;
            background: var(--bg);
            border-radius: 8px;
            line-height: 1.7;
        }

        .markdown-preview h1,
        .markdown-preview h2,
        .markdown-preview h3 {
            margin: 1rem 0 0.5rem 0;
            color: var(--sage-dark);
        }

        .markdown-preview h1 { font-size: 1.8rem; }
        .markdown-preview h2 { font-size: 1.4rem; }
        .markdown-preview h3 { font-size: 1.1rem; }

        .markdown-preview p {
            margin-bottom: 1rem;
        }

        .markdown-preview ul,
        .markdown-preview ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .markdown-preview code {
            background: var(--surface);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .markdown-preview a {
            color: var(--sage-dark);
            text-decoration: underline;
        }

        /* Preview Toggle */
        .preview-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .preview-toggle button {
            flex: 1;
        }

        .preview-toggle button.active {
            background: var(--sage);
            color: white;
        }

        /* Templates */
        .template-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--sage-dark);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        /* Project View */
        .project-section {
            margin-bottom: 3rem;
        }

        .project-section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--sage-dark);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--bg);
        }

        /* Favorite Star */
        .favorite-star {
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--border);
            transition: color 0.2s;
        }

        .favorite-star.active {
            color: #FFD700;
        }

        /* Auto-suggest */
        .auto-suggest {
            background: var(--bg);
            padding: 0.75rem;
            border-radius: 8px;
            margin-top: 0.5rem;
        }

        .auto-suggest-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }

        .suggested-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .suggested-tag {
            padding: 0.3rem 0.8rem;
            background: var(--surface);
            border: 1px solid var(--sage);
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggested-tag:hover {
            background: var(--sage);
            color: white;
        }

        /* Note Links */
        .note-links-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid var(--bg);
        }

        .link-item {
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .link-item:hover {
            background: var(--border);
        }

        /* Search */
        .search-container {
            margin-bottom: 2rem;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .search-input {
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.2rem;
            }

            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: stretch;
            }

            .header-actions button {
                flex: 1;
            }

            main {
                margin: 1rem auto;
            }

            .fab {
                bottom: 1rem;
                right: 1rem;
                width: 56px;
                height: 56px;
            }

            .modal-content {
                padding: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        .text-muted {
            color: var(--text-light);
        }

        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🧠 Your Brain, Externalized</h1>
            <div class="header-actions">
                <button class="dark-mode-toggle" onclick="app.toggleDarkMode()" title="Toggle dark mode">🌙</button>
                <button class="btn btn-primary btn-small" onclick="app.showCaptureModal()">+ Capture</button>
                <button class="btn btn-outline btn-small" onclick="app.switchView('settings')">⚙️</button>
            </div>
        </div>
    </header>

    <nav>
        <div class="nav-content">
            <button class="nav-btn active" onclick="app.switchView('home')">Home</button>
            <button class="nav-btn" onclick="app.switchView('all')">All Notes</button>
            <button class="nav-btn" onclick="app.switchView('unprocessed')">Needs Love</button>
            <button class="nav-btn" onclick="app.switchView('timeline')">Timeline</button>
            <button class="nav-btn" onclick="app.switchView('projects')">Projects</button>
            <button class="nav-btn" onclick="app.switchView('tags')">Tags</button>
            <button class="nav-btn" onclick="app.switchView('review')">Review</button>
            <button class="nav-btn" onclick="app.switchView('reading')">Reading</button>
            <button class="nav-btn" onclick="app.switchView('someday')">Someday</button>
        </div>
    </nav>

    <main id="main-content"></main>

    <button class="fab" onclick="app.showCaptureModal()" title="Capture something">+</button>

    <!-- Capture Modal -->
    <div id="capture-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">What did your brain bump into today?</h2>
                <button class="modal-close" onclick="app.closeCaptureModal()">×</button>
            </div>

            <div class="template-buttons">
                <button class="btn btn-small btn-outline" onclick="app.applyTemplate('blank')">Blank</button>
                <button class="btn btn-small btn-outline" onclick="app.applyTemplate('idea')">💡 Idea</button>
                <button class="btn btn-small btn-outline" onclick="app.applyTemplate('learning')">📚 Learning</button>
                <button class="btn btn-small btn-outline" onclick="app.applyTemplate('decision')">⚖️ Decision</button>
                <button class="btn btn-small btn-outline" onclick="app.applyTemplate('book')">📖 Book</button>
                <button class="btn btn-small btn-outline" onclick="app.applyTemplate('meeting')">🤝 Meeting</button>
                <button class="btn btn-small btn-outline" onclick="app.applyTemplate('voice')">🎤 Voice</button>
            </div>

            <form id="note-form" onsubmit="app.saveNote(event)">
                <input type="hidden" id="note-id">

                <div class="form-group">
                    <label for="note-title">Title</label>
                    <input type="text" id="note-title" required>
                </div>

                <div class="form-group">
                    <label for="note-content">Content (Markdown supported)</label>
                    <div class="preview-toggle">
                        <button type="button" class="btn btn-small active" onclick="app.togglePreview('edit')">Edit</button>
                        <button type="button" class="btn btn-small" onclick="app.togglePreview('preview')">Preview</button>
                    </div>
                    <textarea id="note-content" required></textarea>
                    <div id="content-preview" class="markdown-preview hidden"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="note-type">Type</label>
                        <select id="note-type">
                            <option value="idea">Idea</option>
                            <option value="learning">Learning</option>
                            <option value="insight">Insight</option>
                            <option value="decision">Decision</option>
                            <option value="reference">Reference</option>
                            <option value="quote">Quote</option>
                            <option value="resource">Resource</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="note-area">Area</label>
                        <select id="note-area">
                            <option value="">Not sure</option>
                            <option value="business">Business</option>
                            <option value="personal">Personal</option>
                            <option value="creative">Creative</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="note-tags">Tags (press Enter or comma to add)</label>
                    <div class="tag-input-container" id="tag-container">
                        <input type="text" class="tag-input" id="tag-input" placeholder="Add tags...">
                    </div>
                    <div id="suggested-tags-container"></div>
                </div>

                <div class="form-row">

                        <label for="note-project">Project (if any)</label>
                        <input type="text" id="note-project" list="projects-list" placeholder="Optional">

                    <div class="form-group">
                        <label for="note-goal">Goal (if any)</label>

                        <datalist id="goals-list"></datalist>

                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="note-context">Context</label>
                        <select id="note-context">
                            <option value="">Not specified</option>
                            <option value="conversation">Conversation</option>
                            <option value="article">Article</option>
                            <option value="book">Book</option>
                            <option value="client work">Client work</option>

                        </select>

                    <div class="form-group">
                        <label for="note-source">Source (link/reference)</label>
                        <input type="text" id="note-source" placeholder="Optional">
                    </div>
                </div>

                <div class="form-group">
                    <label for="note-date">Date</label>
                    <input type="date" id="note-date">

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="note-favorite"> ⭐ This is important
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="note-key-insight"> 💡 Key insight (I should remember this)
                    </label>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="app.closeCaptureModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save & Don't Forget</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Note Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- Link Notes Modal -->
    <div id="link-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Link to Other Notes</h2>
                <button class="modal-close" onclick="app.closeLinkModal()">×</button>
            </div>
            <div id="link-content"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="app.saveLin ks()">Save Links</button>
            </div>
        </div>
    </div>

    <!-- Super Note Modal -->
    <div id="super-note-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create a Super Note</h2>
                <button class="modal-close" onclick="app.closeSuperNoteModal()">×</button>
            </div>
            <p class="text-muted mb-2">Pull together everything you know about a topic.</p>
            <div id="super-note-content"></div>
        </div>
    </div>

    <script>
        const app = {
            state: {
                notes: [],
                lists: {
                    readingList: [],
                    somedayMaybe: []
                },
                settings: {
                    darkMode: false,
                    showDailyCapture: true,
                    defaultType: 'idea',
                    defaultArea: ''
                },
                currentView: 'home',
                currentNoteId: null,
                editingTags: [],
                searchQuery: '',
                filters: {},
                selectedNotesForLinking: []
            },

            init() {
                this.loadState();
                this.seedDataIfEmpty();
                this.applyDarkMode();
                this.render();
                this.setupEventListeners();
            },

            loadState() {
                try {
                    const notes = localStorage.getItem('pkb_notes');
                    const lists = localStorage.getItem('pkb_lists');
                    const settings = localStorage.getItem('pkb_settings');

                    if (notes) this.state.notes = JSON.parse(notes);
                    if (lists) this.state.lists = JSON.parse(lists);
                    if (settings) this.state.settings = { ...this.state.settings, ...JSON.parse(settings) };
                } catch (error) {
                    console.error('Error loading state:', error);
                }
            },

            saveState() {
                try {
                    localStorage.setItem('pkb_notes', JSON.stringify(this.state.notes));
                    localStorage.setItem('pkb_lists', JSON.stringify(this.state.lists));
                    localStorage.setItem('pkb_settings', JSON.stringify(this.state.settings));
                } catch (error) {
                    console.error('Error saving state:', error);
                    alert('Couldn\'t save your changes. Your browser storage might be full.');
                }
            },

            seedDataIfEmpty() {
                if (this.state.notes.length === 0) {
                    const sampleNotes = [
                        {
                            title: "Book Notes: Building a Second Brain",
                            type: "reference",
                            tags: ["knowledge-management", "productivity", "books"],
                            area: "personal",
                            context: "book",
                            contentMarkdown: `**Book:** Building a Second Brain
**Author:** Tiago Forte

## Key Takeaways

The best way to organize information is by **actionability**, not by category.

CODE framework:
- Capture what resonates
- Organize by actionability
- Distill to the essence
- Express your ideas

## How I'll Apply This

Start organizing notes by project instead of topic. Ask "when will I need this?" instead of "what category is this?"

## One Thing I'll Try

Create project-based folders and move active ideas into them this week.`
                        },
                        {
                            title: "Client Insight: They Don't Want Perfection",
                            type: "insight",
                            tags: ["client-management", "business", "expectations"],
                            area: "business",
                            context: "client work",
                            contentMarkdown: "I used to overthink deliverables. Then I realized: clients don't want perfect—they want **progress**. They want to feel heard and see movement. When I shifted to iterative check-ins instead of \"big reveal\" moments, everything got smoother."
                        },
                        {
                            title: "Decision: When to Say No to Projects",
                            type: "decision",
                            tags: ["boundaries", "pricing", "business"],
                            area: "business",
                            contentMarkdown: `**Decision:** Only take projects if at least 2 of these are true:
1. Excited about the work
2. Good pay
3. Portfolio piece
4. Strategic relationship

**Why:** Too many resentment jobs in 2023.

**Expected Outcome:** Better energy, better work, better clients.

**What to Watch For:** Am I saying yes out of fear?`
                        },
                        {
                            title: "Learning: Humor Beats Polish in Content",
                            type: "learning",
                            tags: ["content", "social-media", "authenticity"],
                            area: "creative",
                            context: "personal experience",
                            contentMarkdown: `**What I Learned:** The posts that perform best aren't the polished ones—they're the honest, slightly messy, funny ones.

**Where This Came From:** 3 months of Instagram experiments.

**How to Use It:** Stop overthinking captions. Write like I'm texting a friend.

**What Gets in the Way:** Perfectionism and imposter syndrome.`
                        },
                        {
                            title: "What I Know About Client Boundaries",
                            type: "insight",
                            tags: ["client-management", "boundaries", "super-note"],
                            area: "business",
                            contentMarkdown: `This is a synthesis of everything I've learned about managing client expectations.

## The Pattern

Clients push boundaries when boundaries aren't clear. It's not malicious—it's human.

## What Works

1. **Set revision limits upfront** (and stick to them)
2. **Define scope in writing** before starting
3. **Repeat the boundaries** during kickoff
4. **Respond to scope creep immediately**, not later

## What Doesn't Work

- Assuming they'll "just know"
- Being vague to seem flexible
- Letting small things slide

## The Reminder

Boundaries aren't mean. They're the thing that lets you do great work without burning out.`,
                            linksTo: []
                        }
                    ];

                    const now = new Date().toISOString();
                    this.state.notes = sampleNotes.map((note) => ({
                        id: this.generateId(),
                        title: note.title,
                        contentMarkdown: note.contentMarkdown,
                        contentHtml: this.markdownToHtml(note.contentMarkdown),
                        type: note.type,
                        tags: note.tags || [],
                        project: note.project || '',
                        goal: note.goal || '',
                        area: note.area || '',
                        context: note.context || '',
                        source: note.source || '',
                        dateCaptured: now,
                        lastUpdated: now,
                        linksTo: note.linksTo || [],
                        favorite: false,
                        keyInsight: false,
                        status: 'processed',
                        repetitionCount: 0,
                        patternFlags: []
                    }));

                    this.saveState();
                }
            },

            generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            },

            toggleDarkMode() {
                this.state.settings.darkMode = !this.state.settings.darkMode;
                this.applyDarkMode();
                this.saveState();
            },

            applyDarkMode() {
                if (this.state.settings.darkMode) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            },

            setupEventListeners() {
                const tagInput = document.getElementById('tag-input');
                if (tagInput) {
                    tagInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ',') {
                            e.preventDefault();
                            const value = tagInput.value.trim().replace(/,/g, '');
                            if (value) {
                                this.addTag(value);
                                tagInput.value = '';
                            }
                        }
                    });

                    tagInput.addEventListener('input', () => {
                        this.updateTagSuggestions(tagInput.value);
                    });
                }

                const contentTextarea = document.getElementById('note-content');
                if (contentTextarea) {
                    contentTextarea.addEventListener('input', () => {
                        this.updateContentPreview();
                        this.updateTagSuggestions('');
                    });
                }

                const dateInput = document.getElementById('note-date');
                if (dateInput && !dateInput.value) {
                    dateInput.value = new Date().toISOString().split('T')[0];
                }
            },

            markdownToHtml(markdown) {
                let html = markdown;

                // Escape HTML
                const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
                html = html.replace(/[&<>]/g, m => escapeMap[m] || m);

                // Headers
                html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

                // Bold
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

                // Italic
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

                // Links
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

                // Inline code
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                // Lists - unordered
                const lines = html.split('\n');
                let inList = false;
                let result = [];

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (/^[*-] (.+)/.test(line)) {
                        if (!inList) {
                            result.push('<ul>');
                            inList = true;
                        }
                        result.push(line.replace(/^[*-] (.+)/, '<li>$1</li>'));
                    } else if (/^\d+\. (.+)/.test(line)) {
                        if (!inList) {
                            result.push('<ol>');
                            inList = 'ol';
                        }
                        result.push(line.replace(/^\d+\. (.+)/, '<li>$1</li>'));
                    } else {
                        if (inList) {
                            result.push(inList === 'ol' ? '</ol>' : '</ul>');
                            inList = false;
                        }
                        result.push(line);
                    }
                }

                if (inList) {
                    result.push(inList === 'ol' ? '</ol>' : '</ul>');
                }

                html = result.join('\n');

                // Paragraphs
                html = html.split('\n\n').map(para => {
                    para = para.trim();
                    if (!para) return '';
                    if (para.startsWith('<')) return para;
                    return `<p>${para.replace(/\n/g, '<br>')}</p>`;
                }).join('\n');

                return html;
            },

            addTag(tag) {
                if (tag && !this.state.editingTags.includes(tag)) {
                    this.state.editingTags.push(tag);
                    this.renderTagInput();
                }
            },

            removeTag(tag) {
                this.state.editingTags = this.state.editingTags.filter(t => t !== tag);
                this.renderTagInput();
            },

            renderTagInput() {
                const container = document.getElementById('tag-container');
                if (!container) return;

                const input = document.getElementById('tag-input');
                container.innerHTML = '';

                this.state.editingTags.forEach(tag => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'tag-item';
                    tagEl.innerHTML = `${this.escapeHtml(tag)} <span class="tag-remove" onclick="app.removeTag('${this.escapeHtml(tag)}')">×</span>`;
                    container.appendChild(tagEl);
                });

                container.appendChild(input);
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            updateTagSuggestions(input) {
                const allTags = new Set();
                this.state.notes.forEach(note => {
                    note.tags.forEach(tag => allTags.add(tag));
                });

                const content = document.getElementById('note-content')?.value || '';
                const title = document.getElementById('note-title')?.value || '';
                const keywords = this.extractKeywords(content + ' ' + title);

                const suggested = [...new Set([...keywords, ...allTags])].filter(tag =>
                    !this.state.editingTags.includes(tag) &&
                    (!input || tag.toLowerCase().includes(input.toLowerCase()))
                ).slice(0, 8);

                this.renderTagSuggestions(suggested);
            },

            extractKeywords(text) {
                const keywords = new Set();
                const lower = text.toLowerCase();

                // Capitalized words
                const caps = text.match(/\b[A-Z][a-z]+\b/g) || [];
                caps.forEach(word => {
                    if (word.length > 3) keywords.add(word.toLowerCase());
                });

                // Common themes
                const themes = ['strategy', 'creativity', 'productivity', 'client', 'branding',
                               'money', 'design', 'marketing', 'business', 'content', 'systems',
                               'boundaries', 'pricing', 'energy', 'focus', 'clarity'];
                themes.forEach(theme => {
                    if (lower.includes(theme)) keywords.add(theme);
                });

                return Array.from(keywords);
            },

            renderTagSuggestions(tags) {
                const container = document.getElementById('suggested-tags-container');
                if (!container) return;

                if (tags.length === 0) {
                    container.innerHTML = '';
                    return;
                }

                container.innerHTML = `
                    <div class="auto-suggest">
                        <div class="auto-suggest-title">Suggested:</div>
                        <div class="suggested-tags">
                            ${tags.map(tag => `
                                <span class="suggested-tag" onclick="app.addTag('${this.escapeHtml(tag)}')">${this.escapeHtml(tag)}</span>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            applyTemplate(type) {
                const templates = {
                    blank: { title: '', content: '' },
                    idea: {
                        title: 'New Idea',
                        content: `## The Idea

## Why This Matters

## Where It Fits
(Project/goal?)

## Next Step
(One tiny action)`
                    },
                    learning: {
                        title: 'Something I Learned',
                        content: `## What I Learned

## Where This Came From

## How/Where to Use It

## What Gets in the Way`
                    },
                    decision: {
                        title: 'Decision Log',
                        content: `**Decision:**

**Options I Considered:**

**Why I Chose This:**

**Expected Outcome:**

**What to Watch For:**`
                    },
                    book: {
                        title: 'Book Notes',
                        content: `**Book:**
**Author:**
**Date Read:**

## Key Takeaways

## Quotes Worth Keeping

## How to Apply This

## One Thing I'll Try`
                    },
                    meeting: {
                        title: 'Meeting Notes',
                        content: `**Date:**
**Who Was There:**
**Purpose:**

## What We Talked About

## Decisions Made

## Action Items

## Follow-Ups`
                    },
                    voice: {
                        title: 'Voice Note – ' + new Date().toLocaleString(),
                        content: `🎤 **This was a voice note.**

Transcribe it here when you're ready, or just capture the main points.

## Key Points

## What to Do With This`
                    }
                };

                const template = templates[type] || templates.blank;
                document.getElementById('note-title').value = template.title;
                document.getElementById('note-content').value = template.content;

                if (type !== 'blank') {
                    const typeMap = {
                        'book': 'reference',
                        'meeting': 'reference',
                        'voice': 'idea'
                    };
                    document.getElementById('note-type').value = typeMap[type] || type;
                }

                this.updateContentPreview();
                this.updateTagSuggestions('');
            },

            togglePreview(mode) {
                const textarea = document.getElementById('note-content');
                const preview = document.getElementById('content-preview');
                const buttons = document.querySelectorAll('.preview-toggle button');

                if (!textarea || !preview) return;

                buttons.forEach(btn => btn.classList.remove('active'));

                if (mode === 'preview') {
                    textarea.classList.add('hidden');
                    preview.classList.remove('hidden');
                    buttons[1].classList.add('active');
                    this.updateContentPreview();
                } else {
                    textarea.classList.remove('hidden');
                    preview.classList.add('hidden');
                    buttons[0].classList.add('active');
                }
            },

            updateContentPreview() {
                const content = document.getElementById('note-content')?.value || '';
                const preview = document.getElementById('content-preview');
                if (preview) {
                    preview.innerHTML = this.markdownToHtml(content);
                }
            },

            showCaptureModal(noteId = null, templateType = null) {
                const modal = document.getElementById('capture-modal');
                const form = document.getElementById('note-form');

                form.reset();
                this.state.editingTags = [];
                this.renderTagInput();

                if (noteId) {
                    const note = this.state.notes.find(n => n.id === noteId);
                    if (note) {
                        document.getElementById('modal-title').textContent = 'Edit Note';
                        document.getElementById('note-id').value = note.id;
                        document.getElementById('note-title').value = note.title;
                        document.getElementById('note-content').value = note.contentMarkdown;
                        document.getElementById('note-type').value = note.type;
                        document.getElementById('note-project').value = note.project || '';
                        document.getElementById('note-goal').value = note.goal || '';
                        document.getElementById('note-area').value = note.area || '';
                        document.getElementById('note-context').value = note.context || '';
                        document.getElementById('note-source').value = note.source || '';
                        document.getElementById('note-date').value = note.dateCaptured.split('T')[0];
                        document.getElementById('note-favorite').checked = note.favorite;
                        document.getElementById('note-key-insight').checked = note.keyInsight;
                        this.state.editingTags = [...note.tags];
                        this.renderTagInput();
                    }
                } else {
                    document.getElementById('modal-title').textContent = 'What did your brain bump into today?';
                    document.getElementById('note-date').value = new Date().toISOString().split('T')[0];
                    document.getElementById('note-type').value = this.state.settings.defaultType || 'idea';
                    document.getElementById('note-area').value = this.state.settings.defaultArea || '';

                    if (templateType) {
                        this.applyTemplate(templateType);
                    }
                }

                this.updateDataLists();
                modal.classList.add('active');
                setTimeout(() => {
                    document.getElementById('note-title')?.focus();
                }, 100);
            },

            closeCaptureModal() {
                document.getElementById('capture-modal').classList.remove('active');
            },

            updateDataLists() {
                const projects = new Set();
                const goals = new Set();

                this.state.notes.forEach(note => {
                    if (note.project) projects.add(note.project);
                    if (note.goal) goals.add(note.goal);
                });

                document.getElementById('projects-list').innerHTML =
                    Array.from(projects).map(p => `<option value="${this.escapeHtml(p)}">`).join('');
                document.getElementById('goals-list').innerHTML =
                    Array.from(goals).map(g => `<option value="${this.escapeHtml(g)}">`).join('');
            },

            saveNote(event) {
                event.preventDefault();

                const id = document.getElementById('note-id').value;
                const title = document.getElementById('note-title').value;
                const contentMarkdown = document.getElementById('note-content').value;
                const type = document.getElementById('note-type').value;
                const project = document.getElementById('note-project').value;
                const goal = document.getElementById('note-goal').value;
                const area = document.getElementById('note-area').value;
                const context = document.getElementById('note-context').value;
                const source = document.getElementById('note-source').value;
                const dateCaptured = document.getElementById('note-date').value;
                const favorite = document.getElementById('note-favorite').checked;
                const keyInsight = document.getElementById('note-key-insight').checked;

                const noteData = {
                    title,
                    contentMarkdown,
                    contentHtml: this.markdownToHtml(contentMarkdown),
                    type,
                    tags: [...this.state.editingTags],
                    project,
                    goal,
                    area,
                    context,
                    source,
                    dateCaptured: dateCaptured + 'T00:00:00.000Z',
                    lastUpdated: new Date().toISOString(),
                    favorite,
                    keyInsight,
                    status: 'unprocessed',
                    repetitionCount: 0,
                    patternFlags: []
                };

                if (id) {
                    const index = this.state.notes.findIndex(n => n.id === id);
                    if (index !== -1) {
                        noteData.linksTo = this.state.notes[index].linksTo || [];
                        this.state.notes[index] = { ...this.state.notes[index], ...noteData };
                    }
                } else {
                    noteData.id = this.generateId();
                    noteData.linksTo = [];
                    this.state.notes.unshift(noteData);
                }

                this.detectPatterns(noteData);
                this.saveState();
                this.closeCaptureModal();
                this.render();
            },

            deleteNote(id) {
                if (confirm('Delete this note? (You can\'t undo this)')) {
                    this.state.notes = this.state.notes.filter(n => n.id !== id);

                    // Remove from other notes' linksTo
                    this.state.notes.forEach(note => {
                        if (note.linksTo && note.linksTo.includes(id)) {
                            note.linksTo = note.linksTo.filter(linkId => linkId !== id);
                        }
                    });

                    this.saveState();
                    this.render();
                    this.closeDetailModal();
                }
            },

            toggleFavorite(id) {
                const note = this.state.notes.find(n => n.id === id);
                if (note) {
                    note.favorite = !note.favorite;
                    this.saveState();

                    // Update just the star without full re-render
                    const stars = document.querySelectorAll(`[onclick*="toggleFavorite('${id}')"]`);
                    stars.forEach(star => {
                        if (note.favorite) {
                            star.classList.add('active');
                        } else {
                            star.classList.remove('active');
                        }
                    });
                }
            },

            markProcessed(id) {
                const note = this.state.notes.find(n => n.id === id);
                if (note) {
                    note.status = 'processed';
                    note.lastUpdated = new Date().toISOString();
                    this.saveState();
                    this.render();
                }
            },

            detectPatterns(newNote) {
                const similar = this.state.notes.filter(note => {
                    if (note.id === newNote.id) return false;

                    const sharedTags = note.tags.filter(tag => newNote.tags.includes(tag));
                    const titleSimilarity = this.calculateSimilarity(note.title, newNote.title);
                    const contentSimilarity = this.calculateSimilarity(
                        note.contentMarkdown.substring(0, 200),
                        newNote.contentMarkdown.substring(0, 200)
                    );

                    return sharedTags.length >= 2 || titleSimilarity > 0.5 || contentSimilarity > 0.4;
                });

                if (similar.length > 0) {
                    const note = this.state.notes.find(n => n.id === newNote.id);
                    if (note) {
                        note.repetitionCount = similar.length;
                        note.patternFlags = similar.map(n => n.id);
                    }
                }
            },

            calculateSimilarity(str1, str2) {
                if (!str1 || !str2) return 0;
                const words1 = str1.toLowerCase().split(/\s+/);
                const words2 = str2.toLowerCase().split(/\s+/);
                const common = words1.filter(word => word.length > 3 && words2.includes(word));
                return common.length / Math.max(words1.length, words2.length, 1);
            },

            getRelatedNotes(noteId, limit = 5) {
                const note = this.state.notes.find(n => n.id === noteId);
                if (!note) return [];

                const scored = this.state.notes
                    .filter(n => n.id !== noteId)
                    .map(n => ({
                        note: n,
                        score: this.calculateRelatedness(note, n)
                    }))
                    .filter(item => item.score > 0)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, limit);

                return scored.map(item => item.note);
            },

            calculateRelatedness(note1, note2) {
                let score = 0;

                const sharedTags = note1.tags.filter(tag => note2.tags.includes(tag));
                score += sharedTags.length * 5;

                if (note1.type === note2.type) score += 2;
                if (note1.project && note1.project === note2.project) score += 8;
                if (note1.goal && note1.goal === note2.goal) score += 6;
                if (note1.area === note2.area && note1.area) score += 1;

                const contentSim = this.calculateSimilarity(note1.contentMarkdown, note2.contentMarkdown);
                score += contentSim * 10;

                return score;
            },

            getLinkedFrom(noteId) {
                return this.state.notes.filter(note =>
                    note.linksTo && note.linksTo.includes(noteId)
                );
            },

            searchNotes(query, filters = {}) {
                let results = this.state.notes;

                if (query) {
                    query = query.toLowerCase();
                    results = results.map(note => {
                        let score = 0;
                        const titleLower = note.title.toLowerCase();
                        const contentLower = note.contentMarkdown.toLowerCase();
                        const firstLines = contentLower.substring(0, 200);

                        // Semantic scoring
                        if (titleLower.includes(query)) score += 10;
                        if (note.tags.some(tag => tag.toLowerCase().includes(query))) score += 8;
                        if (firstLines.includes(query)) score += 5;
                        if (contentLower.includes(query)) score += 2;
                        if (note.project && note.project.toLowerCase().includes(query)) score += 6;
                        if (note.goal && note.goal.toLowerCase().includes(query)) score += 6;

                        return { note, score };
                    }).filter(item => item.score > 0)
                      .sort((a, b) => b.score - a.score)
                      .map(item => item.note);
                }

                if (filters.type) results = results.filter(n => n.type === filters.type);
                if (filters.project) results = results.filter(n => n.project === filters.project);
                if (filters.goal) results = results.filter(n => n.goal === filters.goal);
                if (filters.tag) results = results.filter(n => n.tags.includes(filters.tag));
                if (filters.favorite) results = results.filter(n => n.favorite);
                if (filters.area) results = results.filter(n => n.area === filters.area);
                if (filters.status) results = results.filter(n => n.status === filters.status);

                return results;
            },

            switchView(view) {
                this.state.currentView = view;

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('active');
                });

                const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(btn =>
                    btn.textContent.toLowerCase().includes(view.toLowerCase().split('-')[0])
                );
                if (activeBtn) activeBtn.classList.add('active');

                this.render();
            },

            render() {
                const main = document.getElementById('main-content');
                if (!main) return;

                const views = {
                    'home': () => this.renderHomeView(),
                    'all': () => this.renderAllNotesView(),
                    'unprocessed': () => this.renderUnprocessedView(),
                    'timeline': () => this.renderTimelineView(),
                    'projects': () => this.renderProjectsView(),
                    'tags': () => this.renderTagCloudView(),
                    'review': () => this.renderReviewView(),
                    'review-weekly': () => this.renderWeeklyReview(),
                    'review-monthly': () => this.renderMonthlyReview(),
                    'review-quarterly': () => this.renderQuarterlyReview(),
                    'review-random': () => this.renderRandomNote(),
                    'reading': () => this.renderReadingListView(),
                    'someday': () => this.renderSomedayView(),
                    'settings': () => this.renderSettingsView()
                };

                const renderFn = views[this.state.currentView] || views['home'];
                main.innerHTML = renderFn();
            },

            renderHomeView() {
                const stats = this.getStats();
                const recentNotes = this.state.notes.slice(0, 5);
                const unprocessedCount = this.state.notes.filter(n => n.status === 'unprocessed').length;
                const patterns = this.state.notes.filter(n => n.repetitionCount > 2);

                return `
                    ${this.state.settings.showDailyCapture ? `
                    <div class="daily-capture">
                        <h2>What did your brain bump into today?</h2>
                        <p>Don't just collect ideas — use them.</p>
                        <button class="btn btn-secondary" onclick="app.showCaptureModal()">Capture Something</button>
                    </div>
                    ` : ''}

                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-value">${stats.total}</div>
                            <div class="stat-label">Notes</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.insights}</div>
                            <div class="stat-label">Insights</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.ideas}</div>
                            <div class="stat-label">Ideas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${unprocessedCount}</div>
                            <div class="stat-label">Need Love</div>
                        </div>
                    </div>

                    ${patterns.length > 0 ? `
                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">🔄 Patterns You Keep Seeing</h3>
                        <p class="text-muted mb-2">Maybe it's time to implement these instead of just capturing them?</p>
                        ${patterns.slice(0, 3).map(note => `
                            <div class="link-item" onclick="app.showNoteDetail('${note.id}')">
                                <strong>${note.title}</strong>
                                <div class="text-muted" style="font-size: 0.85rem;">Captured ${note.repetitionCount} times</div>
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}

                    ${unprocessedCount > 0 ? `
                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">📝 Notes That Need Love</h3>
                        <p class="text-muted mb-2">${unprocessedCount} notes waiting to be tagged and processed.</p>
                        <button class="btn btn-outline btn-small" onclick="app.switchView('unprocessed')">Process Them</button>
                    </div>
                    ` : ''}

                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">Recent Captures</h3>
                        ${recentNotes.length === 0 ?
                            '<p class="text-muted">No notes yet. Time to capture something!</p>' :
                            recentNotes.map(note => this.renderNoteCard(note)).join('')
                        }
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                        <div class="card card-clickable" onclick="app.switchView('review-random')">
                            <h3>🎲 Random Note</h3>
                            <p class="text-muted">Resurface something you forgot</p>
                        </div>
                        <div class="card card-clickable" onclick="app.switchView('review-weekly')">
                            <h3>📅 This Week</h3>
                            <p class="text-muted">What you captured lately</p>
                        </div>
                        <div class="card card-clickable" onclick="app.switchView('projects')">
                            <h3>📁 Projects</h3>
                            <p class="text-muted">Organize by what you're working on</p>
                        </div>
                    </div>
                `;
            },

            renderAllNotesView() {
                const notes = this.state.notes;

                return `
                    <div class="search-container">
                        <div class="search-box">
                            <input type="text" class="search-input" placeholder="Search your brain..."
                                   onkeyup="app.handleSearch(event)">
                        </div>
                    </div>

                    ${notes.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">🧠</div>
                            <h2>Your brain is empty</h2>
                            <p>Just kidding. But this database is. Capture something!</p>
                            <button class="btn btn-primary mt-2" onclick="app.showCaptureModal()">Add First Note</button>
                        </div>
                    ` : notes.map(note => this.renderNoteCard(note)).join('')}
                `;
            },

            renderUnprocessedView() {
                const unprocessed = this.state.notes.filter(n => n.status === 'unprocessed');

                return `
                    <h2 style="margin-bottom: 1rem;">Notes That Need Love</h2>
                    <p class="text-muted mb-3">Add tags, link them to projects, or just review and mark as processed.</p>

                    ${unprocessed.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">✅</div>
                            <h2>All caught up!</h2>
                            <p>Every note has been processed. Future you says thanks.</p>
                        </div>
                    ` : unprocessed.map(note => this.renderNoteCard(note, true)).join('')}
                `;
            },

            renderNoteCard(note, showProcessButton = false) {
                const preview = note.contentMarkdown.substring(0, 150) + (note.contentMarkdown.length > 150 ? '...' : '');

                return `
                    <div class="card card-clickable note-card" onclick="app.showNoteDetail('${note.id}')">
                        <div class="note-header">
                            <div style="flex: 1;">
                                <div class="note-title">${this.escapeHtml(note.title)}</div>
                                <div class="note-meta">
                                    <span class="note-type type-${note.type}">${note.type}</span>
                                    ${note.project ? `<span>📁 ${this.escapeHtml(note.project)}</span>` : ''}
                                    ${note.goal ? `<span>🎯 ${this.escapeHtml(note.goal)}</span>` : ''}
                                    <span>${new Date(note.dateCaptured).toLocaleDateString()}</span>
                                </div>
                            </div>
                            <span class="favorite-star ${note.favorite ? 'active' : ''}"
                                  onclick="event.stopPropagation(); app.toggleFavorite('${note.id}')">★</span>
                        </div>
                        <div class="note-content note-content-preview">${this.escapeHtml(preview)}</div>
                        ${note.tags.length > 0 ? `
                            <div class="tags">
                                ${note.tags.map(tag => `<span class="tag" onclick="event.stopPropagation(); app.filterByTag('${this.escapeHtml(tag)}')">${this.escapeHtml(tag)}</span>`).join('')}
                            </div>
                        ` : ''}
                        ${note.repetitionCount > 2 ? `
                            <div class="pattern-alert mt-2">
                                <div class="pattern-alert-title">🔄 You've seen this ${note.repetitionCount} times</div>
                                <p>Maybe it's time to actually do something about it?</p>
                            </div>
                        ` : ''}
                        ${showProcessButton ? `
                            <button class="btn btn-small btn-outline mt-2"
                                    onclick="event.stopPropagation(); app.markProcessed('${note.id}')">
                                ✓ Mark Processed
                            </button>
                        ` : ''}
                    </div>
                `;
            },

            showNoteDetail(noteId) {
                const note = this.state.notes.find(n => n.id === noteId);
                if (!note) return;

                const related = this.getRelatedNotes(noteId);
                const linkedFrom = this.getLinkedFrom(noteId);
                const linkedTo = note.linksTo ? this.state.notes.filter(n => note.linksTo.includes(n.id)) : [];

                const modal = document.getElementById('detail-modal');
                const content = document.getElementById('detail-content');

                content.innerHTML = `
                    <div class="modal-header">
                        <h2 class="modal-title">${this.escapeHtml(note.title)}</h2>
                        <button class="modal-close" onclick="app.closeDetailModal()">×</button>
                    </div>

                    <div class="note-meta mb-2">
                        <span class="note-type type-${note.type}">${note.type}</span>
                        ${note.project ? `<span>📁 ${this.escapeHtml(note.project)}</span>` : ''}
                        ${note.goal ? `<span>🎯 ${this.escapeHtml(note.goal)}</span>` : ''}
                        ${note.area ? `<span>📍 ${note.area}</span>` : ''}
                        <span>${new Date(note.dateCaptured).toLocaleDateString()}</span>
                        <span class="favorite-star ${note.favorite ? 'active' : ''}"
                              onclick="app.toggleFavorite('${note.id}')">★</span>
                    </div>

                    ${note.tags.length > 0 ? `
                        <div class="tags mb-3">
                            ${note.tags.map(tag => `<span class="tag" onclick="app.filterByTag('${this.escapeHtml(tag)}')">${this.escapeHtml(tag)}</span>`).join('')}
                        </div>
                    ` : ''}

                    ${note.repetitionCount > 2 ? `
                        <div class="pattern-alert">
                            <div class="pattern-alert-title">🔄 Pattern Detected</div>
                            <p>You've captured something like this ${note.repetitionCount} times. Consider turning this into an action or decision.</p>
                            <button class="btn btn-small btn-primary mt-1" onclick="app.createActionFromPattern('${note.id}')">
                                Turn into Action
                            </button>
                        </div>
                    ` : ''}

                    <div class="markdown-preview">
                        ${note.contentHtml}
                    </div>

                    ${note.context ? `<p class="mt-2"><strong>Context:</strong> ${note.context}</p>` : ''}
                    ${note.source ? `<p><strong>Source:</strong> ${note.source}</p>` : ''}

                    ${linkedTo.length > 0 || linkedFrom.length > 0 ? `
                        <div class="note-links-section">
                            <h3 style="margin-bottom: 1rem;">🔗 Connected Notes</h3>
                            ${linkedTo.length > 0 ? `
                                <div style="margin-bottom: 1rem;">
                                    <strong>Links to:</strong>
                                    ${linkedTo.map(n => `
                                        <div class="link-item" onclick="app.showNoteDetail('${n.id}')">
                                            ${this.escapeHtml(n.title)}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            ${linkedFrom.length > 0 ? `
                                <div>
                                    <strong>Linked from:</strong>
                                    ${linkedFrom.map(n => `
                                        <div class="link-item" onclick="app.showNoteDetail('${n.id}')">
                                            ${this.escapeHtml(n.title)}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    ${related.length > 0 ? `
                        <div class="related-notes">
                            <h3>Related Notes</h3>
                            <p class="text-muted" style="font-size: 0.9rem; margin-bottom: 1rem;">Based on shared tags, projects, and topics</p>
                            ${related.map(r => `
                                <div class="related-note-item" onclick="app.showNoteDetail('${r.id}')">
                                    <div style="font-weight: 600; margin-bottom: 0.25rem;">${this.escapeHtml(r.title)}</div>
                                    <div style="font-size: 0.85rem; color: var(--text-light);">
                                        <span class="note-type type-${r.type}">${r.type}</span>
                                        ${r.tags.slice(0, 3).map(tag => `<span class="tag">${this.escapeHtml(tag)}</span>`).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}

                    <div class="modal-actions">
                        <button class="btn btn-outline btn-small" onclick="app.showLinkModal('${note.id}')">🔗 Link Notes</button>
                        <button class="btn btn-outline btn-small" onclick="app.exportNoteMarkdown('${note.id}')">📄 Export</button>
                        <button class="btn btn-outline btn-small" onclick="app.showCaptureModal('${note.id}')">✏️ Edit</button>
                        ${note.status === 'unprocessed' ? `
                            <button class="btn btn-primary btn-small" onclick="app.markProcessed('${note.id}')">✓ Processed</button>
                        ` : ''}
                        <button class="btn btn-secondary btn-small" onclick="app.deleteNote('${note.id}')">🗑️ Delete</button>
                    </div>
                `;

                modal.classList.add('active');
            },

            closeDetailModal() {
                document.getElementById('detail-modal').classList.remove('active');
            },

            showLinkModal(noteId) {
                this.state.currentNoteId = noteId;
                const note = this.state.notes.find(n => n.id === noteId);
                if (!note) return;

                const modal = document.getElementById('link-modal');
                const content = document.getElementById('link-content');

                const existingLinks = note.linksTo || [];

                content.innerHTML = `
                    <p class="text-muted mb-3">Select notes to link to "${this.escapeHtml(note.title)}"</p>
                    <div style="max-height: 400px; overflow-y: auto;">
                        ${this.state.notes.filter(n => n.id !== noteId).map(n => `
                            <div class="list-item">
                                <label style="flex: 1; cursor: pointer; margin: 0;">
                                    <input type="checkbox"
                                           value="${n.id}"
                                           ${existingLinks.includes(n.id) ? 'checked' : ''}
                                           style="margin-right: 0.5rem;">
                                    ${this.escapeHtml(n.title)}
                                    <div class="text-muted" style="font-size: 0.85rem; margin-left: 1.5rem;">
                                        <span class="note-type type-${n.type}">${n.type}</span>
                                        ${n.tags.slice(0, 2).map(tag => `<span class="tag">${this.escapeHtml(tag)}</span>`).join('')}
                                    </div>
                                </label>
                            </div>
                        `).join('')}
                    </div>
                `;

                modal.classList.add('active');
            },
