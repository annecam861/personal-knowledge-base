            closeLinkModal() {
                document.getElementById('link-modal').classList.remove('active');
            },

            saveLinks() {
                const checkboxes = document.querySelectorAll('#link-content input[type="checkbox"]:checked');
                const linkedIds = Array.from(checkboxes).map(cb => cb.value);

                const note = this.state.notes.find(n => n.id === this.state.currentNoteId);
                if (note) {
                    note.linksTo = linkedIds;
                    this.saveState();
                    this.closeLinkModal();
                    this.showNoteDetail(note.id);
                }
            },

            createActionFromPattern(noteId) {
                this.closeDetailModal();
                this.showCaptureModal(null, 'decision');
                setTimeout(() => {
                    const note = this.state.notes.find(n => n.id === noteId);
                    if (note) {
                        document.getElementById('note-title').value = `Action: ${note.title}`;
                        document.getElementById('note-tags').value = note.tags.join(', ');
                    }
                }, 100);
            },

            renderTimelineView() {
                const sorted = [...this.state.notes].sort((a, b) =>
                    new Date(b.dateCaptured) - new Date(a.dateCaptured)
                );

                return `
                    <h2 style="margin-bottom: 2rem;">Your Timeline</h2>
                    <p class="text-muted mb-3">Every thought, in order.</p>
                    <div class="timeline">
                        ${sorted.map(note => `
                            <div class="timeline-item">
                                <div class="timeline-date">
                                    ${new Date(note.dateCaptured).toLocaleDateString('en-US', {
                                        weekday: 'short',
                                        month: 'short',
                                        day: 'numeric',
                                        year: 'numeric'
                                    })}
                                </div>
                                ${this.renderNoteCard(note)}
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            renderTagCloudView() {
                const tagCounts = {};
                this.state.notes.forEach(note => {
                    note.tags.forEach(tag => {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                });

                const tags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]);

                if (tags.length === 0) {
                    return `
                        <div class="empty-state">
                            <div class="empty-state-icon">🏷️</div>
                            <h2>No tags yet</h2>
                            <p>Tags help you find patterns. Add some to your notes!</p>
                        </div>
                    `;
                }

                const maxCount = Math.max(...tags.map(t => t[1]));

                return `
                    <h2 style="margin-bottom: 1rem; text-align: center;">Your Tags</h2>
                    <p class="text-muted" style="text-align: center; margin-bottom: 2rem;">
                        Bigger = more notes. Click to filter.
                    </p>
                    <div class="tag-cloud">
                        ${tags.map(([tag, count]) => {
                            const size = 0.9 + (count / maxCount) * 1.4;
                            return `
                                <span class="cloud-tag"
                                      style="font-size: ${size}rem;"
                                      onclick="app.filterByTag('${this.escapeHtml(tag)}')">
                                    ${this.escapeHtml(tag)} (${count})
                                </span>
                            `;
                        }).join('')}
                    </div>
                `;
            },

            filterByTag(tag) {
                this.state.currentView = 'all';
                this.state.filters = { tag };
                this.switchView('all');

                setTimeout(() => {
                    const filtered = this.searchNotes('', { tag });
                    const main = document.getElementById('main-content');
                    main.innerHTML = `
                        <h2 style="margin-bottom: 1rem;">Notes tagged "${this.escapeHtml(tag)}"</h2>
                        <button class="btn btn-outline btn-small mb-3" onclick="app.switchView('all'); app.state.filters = {};">
                            ← Back to all notes
                        </button>
                        ${filtered.map(note => this.renderNoteCard(note)).join('')}
                    `;
                }, 50);
            },

            renderProjectsView() {
                const projects = {};
                this.state.notes.forEach(note => {
                    if (note.project) {
                        if (!projects[note.project]) {
                            projects[note.project] = [];
                        }
                        projects[note.project].push(note);
                    }
                });

                const projectNames = Object.keys(projects).sort();

                if (projectNames.length === 0) {
                    return `
                        <div class="empty-state">
                            <div class="empty-state-icon">📁</div>
                            <h2>No projects yet</h2>
                            <p>Link notes to projects to see your thinking evolve over time.</p>
                        </div>
                    `;
                }

                return `
                    <h2 style="margin-bottom: 1rem;">Projects</h2>
                    <p class="text-muted mb-3">See how your thinking evolved on each project.</p>
                    ${projectNames.map(project => {
                        const notes = projects[project].sort((a, b) =>
                            new Date(a.dateCaptured) - new Date(b.dateCaptured)
                        );
                        return `
                            <div class="project-section">
                                <h3 class="project-section-title">📁 ${this.escapeHtml(project)}</h3>
                                <p class="text-muted" style="margin-bottom: 1rem;">
                                    ${notes.length} notes •
                                    ${new Date(notes[0].dateCaptured).toLocaleDateString()} to
                                    ${new Date(notes[notes.length - 1].dateCaptured).toLocaleDateString()}
                                </p>
                                ${notes.map(note => this.renderNoteCard(note)).join('')}
                            </div>
                        `;
                    }).join('')}
                `;
            },

            renderReviewView() {
                return `
                    <h2 style="margin-bottom: 1rem;">Review & Resurface</h2>
                    <p class="text-muted mb-3">Your notes are only useful if you actually see them again.</p>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                        <div class="card card-clickable" onclick="app.switchView('review-weekly')">
                            <h3>📅 This Week</h3>
                            <p class="text-muted">Notes from the last 7 days</p>
                        </div>
                        <div class="card card-clickable" onclick="app.switchView('review-monthly')">
                            <h3>📊 This Month</h3>
                            <p class="text-muted">Themes and patterns</p>
                        </div>
                        <div class="card card-clickable" onclick="app.switchView('review-quarterly')">
                            <h3>🗓️ 3 Months Ago</h3>
                            <p class="text-muted">What were you thinking about?</p>
                        </div>
                        <div class="card card-clickable" onclick="app.switchView('review-random')">
                            <h3>🎲 Random Note</h3>
                            <p class="text-muted">Surprise yourself</p>
                        </div>
                    </div>
                `;
            },

            renderWeeklyReview() {
                const weekAgo = new Date();
                weekAgo.setDate(weekAgo.getDate() - 7);

                const thisWeek = this.state.notes.filter(note =>
                    new Date(note.dateCaptured) >= weekAgo
                ).sort((a, b) => new Date(b.dateCaptured) - new Date(a.dateCaptured));

                return `
                    <h2 style="margin-bottom: 1rem;">This Week's Captures</h2>
                    <p class="text-muted mb-3">What your brain bumped into in the last 7 days.</p>

                    <button class="btn btn-outline btn-small mb-3" onclick="app.switchView('review')">
                        ← Back to Review
                    </button>

                    ${thisWeek.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">📅</div>
                            <p>Nothing captured this week. That's okay—life happens!</p>
                        </div>
                    ` : `
                        <p style="margin-bottom: 1.5rem;"><strong>${thisWeek.length} notes this week</strong></p>
                        ${thisWeek.map(note => this.renderNoteCard(note)).join('')}
                    `}
                `;
            },

            renderMonthlyReview() {
                const monthAgo = new Date();
                monthAgo.setDate(monthAgo.getDate() - 30);

                const thisMonth = this.state.notes.filter(note =>
                    new Date(note.dateCaptured) >= monthAgo
                );

                const tagCounts = {};
                thisMonth.forEach(note => {
                    note.tags.forEach(tag => {
                        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
                    });
                });

                const topTags = Object.entries(tagCounts)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10);

                const typeBreakdown = {
                    insight: 0,
                    learning: 0,
                    idea: 0,
                    decision: 0,
                    reference: 0,
                    quote: 0,
                    resource: 0
                };

                thisMonth.forEach(note => {
                    if (typeBreakdown.hasOwnProperty(note.type)) {
                        typeBreakdown[note.type]++;
                    }
                });

                return `
                    <h2 style="margin-bottom: 1rem;">This Month's Themes</h2>
                    <p class="text-muted mb-3">Patterns from the last 30 days.</p>

                    <button class="btn btn-outline btn-small mb-3" onclick="app.switchView('review')">
                        ← Back to Review
                    </button>

                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">${thisMonth.length} notes this month</h3>

                        <div style="margin-bottom: 2rem;">
                            <h4 style="margin-bottom: 0.5rem;">By Type</h4>
                            ${Object.entries(typeBreakdown)
                                .filter(([_, count]) => count > 0)
                                .map(([type, count]) => `
                                    <div style="margin-bottom: 0.5rem;">
                                        <span class="note-type type-${type}">${type}</span>
                                        <span style="margin-left: 0.5rem;">${count}</span>
                                    </div>
                                `).join('')}
                        </div>

                        ${topTags.length > 0 ? `
                            <div>
                                <h4 style="margin-bottom: 0.5rem;">Top Tags</h4>
                                <div class="tags">
                                    ${topTags.map(([tag, count]) => `
                                        <span class="tag" onclick="app.filterByTag('${this.escapeHtml(tag)}')">
                                            ${this.escapeHtml(tag)} (${count})
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

            renderQuarterlyReview() {
                const threeMonthsAgo = new Date();
                threeMonthsAgo.setDate(threeMonthsAgo.getDate() - 90);
                const fourMonthsAgo = new Date();
                fourMonthsAgo.setDate(fourMonthsAgo.getDate() - 120);

                const notes = this.state.notes.filter(note => {
                    const date = new Date(note.dateCaptured);
                    return date >= fourMonthsAgo && date <= threeMonthsAgo;
                }).sort((a, b) => new Date(b.dateCaptured) - new Date(a.dateCaptured));

                return `
                    <h2 style="margin-bottom: 1rem;">What You Were Thinking 3 Months Ago</h2>
                    <p class="text-muted mb-3">Sometimes the best insights need time to marinate.</p>

                    <button class="btn btn-outline btn-small mb-3" onclick="app.switchView('review')">
                        ← Back to Review
                    </button>

                    ${notes.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">🗓️</div>
                            <p>Nothing from that time period. You might not have been using this yet!</p>
                        </div>
                    ` : `
                        <p style="margin-bottom: 1.5rem;"><strong>${notes.length} notes from ~3 months ago</strong></p>
                        ${notes.map(note => this.renderNoteCard(note)).join('')}
                    `}
                `;
            },

            renderRandomNote() {
                if (this.state.notes.length === 0) {
                    return `
                        <div class="empty-state">
                            <div class="empty-state-icon">🎲</div>
                            <h2>No notes yet</h2>
                            <p>Can't show you a random note if you haven't captured any!</p>
                        </div>
                    `;
                }

                const randomNote = this.state.notes[Math.floor(Math.random() * this.state.notes.length)];
                const daysSince = Math.floor((new Date() - new Date(randomNote.dateCaptured)) / (1000 * 60 * 60 * 24));

                return `
                    <div class="card" style="text-align: center; padding: 2rem;">
                        <h2 style="margin-bottom: 0.5rem;">🎲 Random Resurface</h2>
                        <p class="text-muted">Here's something from ${daysSince} days ago. Why might it still matter?</p>
                        <button class="btn btn-outline btn-small mt-2" onclick="app.switchView('review-random')">
                            🔄 Show Me Another
                        </button>
                    </div>

                    ${this.renderNoteCard(randomNote)}

                    <div class="card" style="text-align: center;">
                        <button class="btn btn-outline" onclick="app.switchView('review')">
                            ← Back to Review
                        </button>
                    </div>
                `;
            },

            renderReadingListView() {
                return `
                    <h2 style="margin-bottom: 1rem;">📚 Reading List</h2>
                    <p class="text-muted mb-3">Stuff to read. No judgment if it never happens.</p>

                    <div class="card">
                        <h3 class="mb-2">Add Something</h3>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="reading-input" placeholder="Book, article, link..."
                                   style="flex: 1;" onkeypress="if(event.key==='Enter') app.addToReadingList()">
                            <button class="btn btn-primary" onclick="app.addToReadingList()">Add</button>
                        </div>
                    </div>

                    ${this.state.lists.readingList.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">📖</div>
                            <p>Your reading list is empty. Add something you want to read (or pretend you'll read).</p>
                        </div>
                    ` : `
                        ${this.state.lists.readingList.map((item, index) => `
                            <div class="list-item">
                                <div class="list-item-content">
                                    <label style="display: flex; align-items: center; cursor: pointer; margin: 0;">
                                        <input type="checkbox"
                                               ${item.status === 'done' ? 'checked' : ''}
                                               onchange="app.toggleReadingStatus(${index})"
                                               style="margin-right: 0.5rem;">
                                        <span style="${item.status === 'done' ? 'text-decoration: line-through; opacity: 0.6;' : ''}">
                                            ${this.escapeHtml(item.title)}
                                        </span>
                                    </label>
                                </div>
                                <div class="list-item-actions">
                                    ${item.status === 'done' ? `
                                        <button class="btn btn-small btn-outline" onclick="app.createNoteFromReading(${index})">
                                            → Note
                                        </button>
                                    ` : ''}
                                    <button class="btn btn-small btn-outline" onclick="app.removeFromReadingList(${index})">
                                        Remove
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    `}
                `;
            },

            renderSomedayView() {
                return `
                    <h2 style="margin-bottom: 1rem;">💭 Someday/Maybe</h2>
                    <p class="text-muted mb-3">Ideas that might be good...someday. Or maybe never. And that's okay.</p>

                    <div class="card">
                        <h3 class="mb-2">Add an Idea</h3>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="someday-input" placeholder="Something for later..."
                                   style="flex: 1;" onkeypress="if(event.key==='Enter') app.addToSomedayList()">
                            <button class="btn btn-primary" onclick="app.addToSomedayList()">Add</button>
                        </div>
                    </div>

                    ${this.state.lists.somedayMaybe.length === 0 ? `
                        <div class="empty-state">
                            <div class="empty-state-icon">💭</div>
                            <p>Your someday/maybe list is empty. Perfect place for half-baked ideas!</p>
                        </div>
                    ` : `
                        ${this.state.lists.somedayMaybe.map((item, index) => `
                            <div class="list-item">
                                <div class="list-item-content">
                                    ${this.escapeHtml(item.title)}
                                    <div class="text-muted" style="font-size: 0.85rem;">
                                        Added ${new Date(item.addedDate).toLocaleDateString()}
                                    </div>
                                </div>
                                <div class="list-item-actions">
                                    <button class="btn btn-small btn-outline" onclick="app.moveToNote(${index})">
                                        → Note
                                    </button>
                                    <button class="btn btn-small btn-outline" onclick="app.removeFromSomedayList(${index})">
                                        Remove
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    `}
                `;
            },

            renderSettingsView() {
                return `
                    <h2 style="margin-bottom: 1rem;">⚙️ Settings</h2>

                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">Preferences</h3>

                        <div class="form-group">
                            <label>
                                <input type="checkbox"
                                       ${this.state.settings.darkMode ? 'checked' : ''}
                                       onchange="app.toggleDarkMode()">
                                Dark mode
                            </label>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox"
                                       ${this.state.settings.showDailyCapture ? 'checked' : ''}
                                       onchange="app.toggleDailyCapture()">
                                Show daily capture prompt on home
                            </label>
                        </div>

                        <div class="form-group">
                            <label for="default-type">Default note type</label>
                            <select id="default-type" onchange="app.updateDefaultType(this.value)">
                                <option value="idea" ${this.state.settings.defaultType === 'idea' ? 'selected' : ''}>Idea</option>
                                <option value="learning" ${this.state.settings.defaultType === 'learning' ? 'selected' : ''}>Learning</option>
                                <option value="insight" ${this.state.settings.defaultType === 'insight' ? 'selected' : ''}>Insight</option>
                                <option value="decision" ${this.state.settings.defaultType === 'decision' ? 'selected' : ''}>Decision</option>
                                <option value="reference" ${this.state.settings.defaultType === 'reference' ? 'selected' : ''}>Reference</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="default-area">Default area</label>
                            <select id="default-area" onchange="app.updateDefaultArea(this.value)">
                                <option value="">None</option>
                                <option value="business" ${this.state.settings.defaultArea === 'business' ? 'selected' : ''}>Business</option>
                                <option value="personal" ${this.state.settings.defaultArea === 'personal' ? 'selected' : ''}>Personal</option>
                                <option value="creative" ${this.state.settings.defaultArea === 'creative' ? 'selected' : ''}>Creative</option>
                                <option value="other" ${this.state.settings.defaultArea === 'other' ? 'selected' : ''}>Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">Data Management</h3>

                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <button class="btn btn-outline" onclick="app.exportAllJSON()">
                                📦 Export All (JSON)
                            </button>
                            <button class="btn btn-outline" onclick="app.showImportModal()">
                                📥 Import
                            </button>
                            <button class="btn btn-outline" onclick="app.clearAllData()">
                                🗑️ Clear Everything
                            </button>
                        </div>

                        <p class="text-muted mt-2" style="font-size: 0.85rem;">
                            Your notes are stored locally in your browser. Export regularly to back them up!
                        </p>
                    </div>

                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">Stats</h3>
                        <p><strong>${this.state.notes.length}</strong> notes</p>
                        <p><strong>${this.state.lists.readingList.length}</strong> reading list items</p>
                        <p><strong>${this.state.lists.somedayMaybe.length}</strong> someday/maybe items</p>
                        <p class="mt-2">
                            <strong>Storage used:</strong>
                            ${(JSON.stringify(this.state).length / 1024).toFixed(1)} KB
                        </p>
                    </div>
                `;
            },

            toggleDailyCapture() {
                this.state.settings.showDailyCapture = !this.state.settings.showDailyCapture;
                this.saveState();
                this.render();
            },

            updateDefaultType(value) {
                this.state.settings.defaultType = value;
                this.saveState();
            },

            updateDefaultArea(value) {
                this.state.settings.defaultArea = value;
                this.saveState();
            },

            clearAllData() {
                if (confirm('Delete EVERYTHING? This cannot be undone. Export first if you want a backup!')) {
                    if (confirm('Seriously? All your notes will be gone forever.')) {
                        localStorage.removeItem('pkb_notes');
                        localStorage.removeItem('pkb_lists');
                        localStorage.removeItem('pkb_settings');
                        location.reload();
                    }
                }
            },

            addToReadingList() {
                const input = document.getElementById('reading-input');
                if (input && input.value.trim()) {
                    this.state.lists.readingList.push({
                        id: this.generateId(),
                        title: input.value.trim(),
                        status: 'to-read',
                        addedDate: new Date().toISOString()
                    });
                    input.value = '';
                    this.saveState();
                    this.render();
                }
            },

            toggleReadingStatus(index) {
                const item = this.state.lists.readingList[index];
                item.status = item.status === 'done' ? 'to-read' : 'done';
                this.saveState();
                this.render();
            },

            removeFromReadingList(index) {
                this.state.lists.readingList.splice(index, 1);
                this.saveState();
                this.render();
            },

            createNoteFromReading(index) {
                const item = this.state.lists.readingList[index];
                this.showCaptureModal(null, 'book');
                setTimeout(() => {
                    document.getElementById('note-title').value = `Notes: ${item.title}`;
                    document.getElementById('note-source').value = item.source || '';
                }, 100);
            },

            addToSomedayList() {
                const input = document.getElementById('someday-input');
                if (input && input.value.trim()) {
                    this.state.lists.somedayMaybe.push({
                        id: this.generateId(),
                        title: input.value.trim(),
                        addedDate: new Date().toISOString()
                    });
                    input.value = '';
                    this.saveState();
                    this.render();
                }
            },

            removeFromSomedayList(index) {
                this.state.lists.somedayMaybe.splice(index, 1);
                this.saveState();
                this.render();
            },

            moveToNote(index) {
                const item = this.state.lists.somedayMaybe[index];
                this.showCaptureModal(null, 'idea');
                setTimeout(() => {
                    document.getElementById('note-title').value = item.title;
                }, 100);
                this.removeFromSomedayList(index);
            },

            handleSearch(event) {
                const query = event.target.value;
                const filtered = this.searchNotes(query, this.state.filters);

                const main = document.getElementById('main-content');
                const searchContainer = main.querySelector('.search-container');

                let html = '';
                if (searchContainer) {
                    html += searchContainer.outerHTML;
                }

                if (query && filtered.length > 0) {
                    html += `<p class="mb-2">Found ${filtered.length} notes</p>`;
                }

                html += filtered.length === 0 && query ?
                    '<div class="empty-state"><p>No notes found. Try different keywords?</p></div>' :
                    filtered.map(note => this.renderNoteCard(note)).join('');

                main.innerHTML = html;
            },

            getStats() {
                return {
                    total: this.state.notes.length,
                    insights: this.state.notes.filter(n => n.type === 'insight').length,
                    ideas: this.state.notes.filter(n => n.type === 'idea').length,
                    decisions: this.state.notes.filter(n => n.type === 'decision').length,
                    learnings: this.state.notes.filter(n => n.type === 'learning').length
                };
            },

            closeSuperNoteModal() {
                document.getElementById('super-note-modal')?.classList.remove('active');
            },

            showImportModal() {
                const html = `
                    <div id="import-modal-temp" class="modal active">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 class="modal-title">Import Notes</h2>
                                <button class="modal-close" onclick="document.getElementById('import-modal-temp').remove()">×</button>
                            </div>

                            <div class="form-group">
                                <label for="import-file">Select JSON File</label>
                                <input type="file" id="import-file" accept=".json">
                            </div>

                            <div class="form-group">
                                <label>
                                    <input type="radio" name="import-mode" value="merge" checked>
                                    Merge with existing notes
                                </label>
                                <br>
                                <label>
                                    <input type="radio" name="import-mode" value="replace">
                                    Replace everything (dangerous!)
                                </label>
                            </div>

                            <div class="modal-actions">
                                <button class="btn btn-outline" onclick="document.getElementById('import-modal-temp').remove()">
                                    Cancel
                                </button>
                                <button class="btn btn-primary" onclick="app.importJSON()">
                                    Import
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', html);
            },

            exportAllJSON() {
                const data = {
                    notes: this.state.notes,
                    lists: this.state.lists,
                    settings: this.state.settings,
                    exportDate: new Date().toISOString(),
                    version: '2.0'
                };

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `brain-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            },

            exportNoteMarkdown(noteId) {
                const note = this.state.notes.find(n => n.id === noteId);
                if (!note) return;

                const markdown = `# ${note.title}

**Type:** ${note.type}
**Tags:** ${note.tags.join(', ')}
${note.project ? `**Project:** ${note.project}  \n` : ''}${note.goal ? `**Goal:** ${note.goal}  \n` : ''}**Date:** ${new Date(note.dateCaptured).toLocaleDateString()}

---

${note.contentMarkdown}
`;

                const blob = new Blob([markdown], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${note.title.replace(/[^a-z0-9]/gi, '-').toLowerCase()}.md`;
                a.click();
                URL.revokeObjectURL(url);
            },

            importJSON() {
                const fileInput = document.getElementById('import-file');
                const mode = document.querySelector('input[name="import-mode"]:checked')?.value || 'merge';

                if (!fileInput || !fileInput.files.length) {
                    alert('Please select a file');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);

                        if (mode === 'replace') {
                            this.state.notes = data.notes || [];
                            this.state.lists = data.lists || { readingList: [], somedayMaybe: [] };
                            this.state.settings = { ...this.state.settings, ...(data.settings || {}) };
                        } else {
                            if (data.notes) {
                                this.state.notes = [...this.state.notes, ...data.notes];
                            }
                            if (data.lists) {
                                this.state.lists.readingList = [...this.state.lists.readingList, ...(data.lists.readingList || [])];
                                this.state.lists.somedayMaybe = [...this.state.lists.somedayMaybe, ...(data.lists.somedayMaybe || [])];
                            }
                        }

                        this.saveState();
                        document.getElementById('import-modal-temp')?.remove();
                        this.render();
                        alert('Import successful! Welcome back to your brain.');
                    } catch (error) {
                        alert('Error importing file: ' + error.message);
                    }
                };

                reader.readAsText(fileInput.files[0]);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
