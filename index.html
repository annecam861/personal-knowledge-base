    <div id="badge-modal" class="modal" onclick="if(event.target===this) app.closeBadge()">
        <div class="modal-content unlock" id="badge-content"></div>
    </div>

    <script>
        /* =========================================================
           Constants
           ========================================================= */
        const NOTION_DEFAULTS = {
            // Database ID (not the data source ID 41c23945-579d-814d-aa01-000bfc2d39bc)
            DATABASE_ID: '41c23945-579d-816d-8f51-c7567eab03ef',
            API_VERSION: '2022-06-28'
        };

        // 3D art from Creative Fabrica (creativeproduction.rrgraph), licensed with Anne's subscription
        const ART = {
            brainIdea: 'design-brainstorm', brainOrbit: 'design-design-idea', brainPink: 'mental-mosque-dome', heartBrain: 'mental-heart-with-mind-icon',
            journal: 'mental-journal-pan', lotus: 'mental-lotus-flower', candle: 'mental-candle', sunCloud: 'mental-cloud-with-sunlight-symbol',
            watch: 'mental-smartwatch', hand: 'mental-support-hand-symbol', couch: 'mental-therapy-couch', water: 'mental-glass-of-water',
            moon: 'dreamscape-crescent-moon', cloud: 'dreamscape-surreal-cloud', key: 'dreamscape-giant-key', island: 'dreamscape-floating-island',
            ladder: 'dreamscape-magic-ladder', airship: 'dreamscape-mini-airship', castle: 'dreamscape-miniature-castle', door: 'dreamscape-portal-door',
            rainbow: 'dreamscape-rainbow-bridge', dreamcatcher: 'dreamscape-dreamcather',
            colorWheel: 'design-color-wheel', folder: 'design-file-management', cloudFolder: 'design-cloud-management', api: 'design-api-setting',
            tablet: 'design-graphic-tablet', appGear: 'design-application-setting', web: 'design-web-development', gear: 'design-design-setting'
        };
        const art = (key, cls = '') => `<img class="art ${cls}" src="assets/art/${ART[key] || key}.webp" alt="" loading="lazy" draggable="false">`;
        const icon = (name, weight = 'duotone') => `<i class="ph-${weight} ph-${name}" aria-hidden="true"></i>`;

        const TYPES = {
            idea:      { label: 'Idea',      icon: 'lightbulb',   color: 'var(--c-sun)',       art: 'brainIdea' },
            learning:  { label: 'Learning',  icon: 'graduation-cap', color: 'var(--c-sky)',    art: 'brainPink' },
            insight:   { label: 'Insight',   icon: 'sparkle',     color: 'var(--c-violet)',    art: 'brainOrbit' },
            decision:  { label: 'Decision',  icon: 'scales',      color: 'var(--c-tangerine)', art: 'key' },
            book:      { label: 'Book',      icon: 'book-open',   color: 'var(--c-mint)',      art: 'journal' },
            meeting:   { label: 'Meeting',   icon: 'handshake',   color: 'var(--c-coral)',     art: 'couch' },
            voice:     { label: 'Voice',     icon: 'microphone',  color: 'var(--c-pink)',      art: 'cloud' },
            quote:     { label: 'Quote',     icon: 'quotes',      color: 'var(--c-pink)',      art: 'heartBrain' },
            reference: { label: 'Reference', icon: 'paperclip',   color: 'var(--c-slate)',     art: 'folder' },
            resource:  { label: 'Resource',  icon: 'toolbox',     color: 'var(--c-mint)',      art: 'appGear' },
            blank:     { label: 'Note',      icon: 'note',        color: 'var(--c-slate)',     art: 'journal' }
        };
        const typeMeta = t => TYPES[t] || { label: t || 'Note', icon: 'note', color: 'var(--c-slate)', art: 'journal' };

        const TAG_COLORS = ['var(--c-sky)', 'var(--c-pink)', 'var(--c-mint)', 'var(--c-tangerine)', 'var(--c-violet)', 'var(--c-sun)', 'var(--c-coral)'];
        const tagColor = tag => { let h = 0; for (const ch of String(tag)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return TAG_COLORS[h % TAG_COLORS.length]; };

        const SPARKS = [
            'What surprised you today?', 'What did a client teach you this week?', 'What would you tell yourself from a year ago?',
            'What keeps coming up that you haven’t acted on?', 'What made you laugh, and why?', 'What’s one idea you’re secretly excited about?',
            'What did you decide, and what almost changed your mind?', 'What’s a small win nobody noticed?', 'What are you overthinking right now?',
            'What did you read that stuck with you?', 'What would make tomorrow 1% easier?', 'What pattern are you starting to see?'
        ];

        const SAVE_CHEERS = [
            ['brain', 'Brain deposit made'], ['sparkle', 'Captured! Future you says thanks'], ['lightbulb', 'Filed under: genius'],
            ['rocket-launch', 'Thought launched'], ['lock-simple', 'Into the vault it goes'], ['seal-check', 'Nice catch'], ['flower-lotus', 'Planted. Watch it grow.']
        ];

        // Milestone badges: notes captured in total
        const BADGES = [
            { at: 1,    art: 'journal', name: 'First Page',        line: 'Your second brain is officially alive.' },
            { at: 5,    art: 'brainIdea', name: 'Spark Plug',      line: 'Five thoughts that didn’t get away.' },
            { at: 10,   art: 'key',     name: 'Key Holder',        line: 'Ten notes. You’re unlocking patterns now.' },
            { at: 25,   art: 'airship', name: 'Liftoff',           line: 'Twenty-five! This thing is flying.' },
            { at: 50,   art: 'castle',  name: 'Brain Castle',      line: 'Fifty notes. You built a castle of ideas.' },
            { at: 100,  art: 'rainbow', name: 'Over the Rainbow',  line: 'One hundred. That’s a real body of thinking.' },
            { at: 250,  art: 'island',  name: 'Your Own World',    line: 'A whole floating island of ideas.' },
            { at: 500,  art: 'brainOrbit', name: 'Orbit Mind',     line: 'Five hundred thoughts in orbit.' },
            { at: 1000, art: 'lotus',   name: 'Zen Archivist',     line: 'One thousand. Legendary.' }
        ];

        const NAV = [
            { view: 'home', label: 'Home', icon: 'house', c: 'var(--c-violet)' },
            { view: 'all', label: 'All Notes', icon: 'squares-four', c: 'var(--c-sky)', count: s => s.notes.length },
            { view: 'unprocessed', label: 'Needs Love', icon: 'heart', c: 'var(--c-pink)', count: s => s.notes.filter(n => n.status === 'unprocessed').length, hot: true },
            { view: 'timeline', label: 'Timeline', icon: 'clock-counter-clockwise', c: 'var(--c-tangerine)' },
            { view: 'projects', label: 'Projects', icon: 'folder-simple', c: 'var(--c-sun)' },
            { view: 'tags', label: 'Tags', icon: 'tag', c: 'var(--c-mint)' },
            { view: 'review', label: 'Review', icon: 'arrows-clockwise', c: 'var(--c-violet)' },
            { view: 'reading', label: 'Reading', icon: 'books', c: 'var(--c-coral)', count: s => s.lists.readingList.filter(i => i.status !== 'done').length },
            { view: 'someday', label: 'Someday', icon: 'cloud', c: 'var(--c-lavender)', count: s => s.lists.somedayMaybe.length }
        ];

        /* =========================================================
           Notion API (through the local proxy in server.js —
           Notion does not allow direct browser requests)
           ========================================================= */
        class NotionAPI {
            constructor(token, databaseId) {
                this.token = token || '';
                this.databaseId = databaseId || NOTION_DEFAULTS.DATABASE_ID;
            }
            async request(endpoint, options = {}) {
                const headers = { 'Notion-Version': NOTION_DEFAULTS.API_VERSION, 'Content-Type': 'application/json' };
                if (this.token) headers['X-Notion-Token'] = this.token;
                let res;
                try {
                    res = await fetch('/notion' + endpoint, { ...options, headers });
                } catch {
                    throw new Error(location.protocol === 'file:' ? 'Open the app through the local server (node server.js), not as a file' : 'Local server isn’t running. Start it with: node server.js');
                }
                const data = await res.json().catch(() => ({}));
                if (res.status === 401 && data.code === 'login_required') { location.href = '/login'; throw new Error('Please sign in again.'); }
                if (!res.ok) {
                    const err = new Error((data.message || `Notion error (${res.status})`).split('\n')[0]);
                    err.status = res.status;
                    err.code = data.code;
                    throw err;
                }
                return data;
            }
            async listDatabases() {
                const res = await this.request('/search', { method: 'POST', body: JSON.stringify({ filter: { property: 'object', value: 'database' }, page_size: 100 }) });
                return res.results.map(db => ({ id: db.id, title: db.title?.map(t => t.plain_text).join('') || 'Untitled database' }));
            }
            getDatabase() { return this.request(`/databases/${this.databaseId}`); }
            // Every page, following Notion's 100-per-request cursor. No filter: Notion rejects an empty one.
            async queryAll() {
                const results = [];
                let cursor = null;
                do {
                    const body = { page_size: 100 };
                    if (cursor) body.start_cursor = cursor;
                    const page = await this.request(`/databases/${this.databaseId}/query`, { method: 'POST', body: JSON.stringify(body) });
                    results.push(...page.results);
                    cursor = page.has_more ? page.next_cursor : null;
                } while (cursor);
                return results;
            }
            createPage(note) { return this.request('/pages', { method: 'POST', body: JSON.stringify({ parent: { database_id: this.databaseId }, properties: this.toProperties(note) }) }); }
            updatePage(pageId, note) { return this.request(`/pages/${pageId}`, { method: 'PATCH', body: JSON.stringify({ properties: this.toProperties(note) }) }); }
            // Moves the page to Notion's trash (restorable there)
            archivePage(pageId) { return this.request(`/pages/${pageId}`, { method: 'PATCH', body: JSON.stringify({ archived: true }) }); }
            richText(text) {
                const chunks = [];
                const s = String(text || '');
                for (let i = 0; i < s.length && chunks.length < 100; i += 2000) chunks.push({ type: 'text', text: { content: s.slice(i, i + 2000) } });
                return { rich_text: chunks };
            }
            toProperties(note) {
                return {
                    'Name': { title: [{ type: 'text', text: { content: (note.title || 'Untitled').slice(0, 2000) } }] },
                    'Type': { select: { name: note.type || 'blank' } },
                    // Notion option names can't contain commas
                    'Tags': { multi_select: [...new Set((note.tags || []).map(t => t.replace(/,/g, ' ').trim()).filter(Boolean))].map(name => ({ name: name.slice(0, 100) })) },
                    'Content': this.richText(note.contentMarkdown),
                    'Project': this.richText(note.project),
                    'Goal': this.richText(note.goal),
                    'Area': this.richText(note.area),
                    'Context': this.richText(note.context),
                    'Source': this.richText(note.source),
                    'Date Captured': { date: { start: (note.dateCaptured || '').slice(0, 10) || app.todayKey() } },
                    'Favorite': { checkbox: !!note.favorite },
                    'Key Insight': { checkbox: !!note.keyInsight },
                    'Status': { select: { name: note.status || 'unprocessed' } },
                    'Repetition Count': { number: note.repetitionCount || 0 }
                };
            }
            fromPage(page) {
                const p = page.properties || {};
                const text = prop => (prop?.rich_text || prop?.title || []).map(t => t.plain_text).join('');
                const date = p['Date Captured']?.date?.start;
                return {
                    id: page.id.replace(/-/g, ''), notionId: page.id,
                    title: text(p.Name) || 'Untitled', type: p.Type?.select?.name || 'blank',
                    tags: (p.Tags?.multi_select || []).map(t => t.name), contentMarkdown: text(p.Content),
                    project: text(p.Project), goal: text(p.Goal), area: text(p.Area), context: text(p.Context), source: text(p.Source),
                    dateCaptured: (date ? date.slice(0, 10) : page.created_time.slice(0, 10)) + 'T00:00:00.000Z',
                    lastUpdated: page.last_edited_time,
                    favorite: !!p.Favorite?.checkbox, keyInsight: !!p['Key Insight']?.checkbox,
                    status: p.Status?.select?.name || 'unprocessed', repetitionCount: p['Repetition Count']?.number || 0
                };
            }
        }

        /* =========================================================
           App
           ========================================================= */
        const app = {
            state: {
                notes: [],
                lists: { readingList: [], somedayMaybe: [] },
                settings: {
                    theme: 'system', showDailyCapture: true, defaultType: 'idea', defaultArea: '', name: '', lastMilestone: 0,
                    notion: { token: '', databaseId: '', databaseTitle: '', enabled: false, lastSync: null }
                },
                pendingDeletes: [],
                currentView: 'home',
                currentNoteId: null,
                editingTags: [],
                filters: {},
                searchQuery: '',
                sparkIndex: Math.floor(Math.random() * SPARKS.length)
            },

            sync: { api: null, busy: false, timer: null, lastAttempt: 0, error: null, serverToken: false, dbChoices: null, chain: Promise.resolve(), queued: new Set() },

            /* ---------- Lifecycle ---------- */
            async init() {
                this.loadState();
                this.migrateFromNotionPage();
                this.applyTheme();
                await this.checkServer();
                // The server holds a Notion token (hosted app, or .env locally): connect without asking
                if (this.sync.serverToken && !this.state.settings.notion.enabled) {
                    this.state.settings.notion = { ...this.state.settings.notion, token: '', databaseId: NOTION_DEFAULTS.DATABASE_ID, enabled: true };
                    this.state.notes = this.state.notes.filter(n => !n.sample);
                    this.saveState();
                }
                if (!this.state.settings.notion.enabled && this.state.notes.length === 0) this.seedSamples();
                this.renderNav();
                this.render();
                this.setupEventListeners();
                if (new URLSearchParams(location.search).get('capture')) { history.replaceState(null, '', location.pathname); this.showCaptureModal(); }
                if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
                if (this.state.settings.notion.enabled) {
                    this.sync.api = new NotionAPI(this.state.settings.notion.token, this.state.settings.notion.databaseId);
                    await this.syncNow({ quiet: true });
                    this.startAutoSync();
                } else {
                    this.setSyncStatus('local');
                }
            },

            loadState() {
                try {
                    const notes = localStorage.getItem('pkb_notes');
                    const lists = localStorage.getItem('pkb_lists');
                    const settings = localStorage.getItem('pkb_settings');
                    const pending = localStorage.getItem('pkb_pending_deletes');
                    if (notes) this.state.notes = JSON.parse(notes);
                    if (lists) this.state.lists = { readingList: [], somedayMaybe: [], ...JSON.parse(lists) };
                    if (settings) {
                        const saved = JSON.parse(settings);
                        if (saved.theme === undefined && saved.darkMode !== undefined) saved.theme = saved.darkMode ? 'dark' : 'light';
                        this.state.settings = { ...this.state.settings, ...saved, notion: { ...this.state.settings.notion, ...(saved.notion || {}) } };
                    }
                    if (pending) this.state.pendingDeletes = JSON.parse(pending);
                } catch (error) {
                    console.error('Error loading state:', error);
                }
                this.state.notes.forEach(n => {
                    n.tags = n.tags || [];
                    n.linksTo = n.linksTo || [];
                    n.contentMarkdown = n.contentMarkdown || '';
                    if (!n.contentHtml) n.contentHtml = this.markdownToHtml(n.contentMarkdown);
                });
            },

            // Reuse the token saved by the standalone Notion setup page (index-notion.html)
            migrateFromNotionPage() {
                const n = this.state.settings.notion;
                if (n.enabled) return;
                try {
                    const old = JSON.parse(localStorage.getItem('pkb-settings') || 'null');
                    if (old && old.syncEnabled) {
                        this.state.settings.notion = { ...n, token: old.notionApiKey || '', databaseId: old.databaseId || NOTION_DEFAULTS.DATABASE_ID, enabled: true };
                        this.state.notes = this.state.notes.filter(x => !x.sample);
                        this.saveState();
                    }
                } catch { /* ignore */ }
            },

            saveState() {
                try {
                    localStorage.setItem('pkb_notes', JSON.stringify(this.state.notes));
                    localStorage.setItem('pkb_lists', JSON.stringify(this.state.lists));
                    localStorage.setItem('pkb_settings', JSON.stringify(this.state.settings));
                    localStorage.setItem('pkb_pending_deletes', JSON.stringify(this.state.pendingDeletes));
                } catch (error) {
                    console.error('Error saving state:', error);
                    this.toast('Couldn’t save on this device. Browser storage might be full.', 'warning', 'var(--c-pink)');
                }
            },

            seedSamples() {
                const samples = [
                    { title: 'Book Notes: Building a Second Brain', type: 'book', tags: ['knowledge-management', 'productivity', 'books'], area: 'personal', context: 'book',
                      contentMarkdown: `**Book:** Building a Second Brain\n**Author:** Tiago Forte\n\n## Key Takeaways\n\nThe best way to organize information is by **actionability**, not by category.\n\nCODE framework:\n- Capture what resonates\n- Organize by actionability\n- Distill to the essence\n- Express your ideas\n\n## One Thing I'll Try\n\nCreate project-based folders and move active ideas into them this week.` },
                    { title: 'Client Insight: They Don’t Want Perfection', type: 'insight', tags: ['client-management', 'business'], area: 'business', context: 'client work', keyInsight: true,
                      contentMarkdown: 'I used to overthink deliverables. Then I realized: clients don’t want perfect, they want **progress**. They want to feel heard and see movement.' },
                    { title: 'Decision: When to Say No to Projects', type: 'decision', tags: ['boundaries', 'pricing', 'business'], area: 'business', favorite: true,
                      contentMarkdown: `**Decision:** Only take projects if at least 2 of these are true:\n1. Excited about the work\n2. Good pay\n3. Portfolio piece\n4. Strategic relationship\n\n**What to Watch For:** Am I saying yes out of fear?` },
                    { title: 'Humor Beats Polish in Content', type: 'learning', tags: ['content', 'social-media'], area: 'creative', context: 'personal experience', status: 'unprocessed',
                      contentMarkdown: `**What I Learned:** The posts that perform best aren’t the polished ones. They’re the honest, slightly messy, funny ones.\n\n**How to Use It:** Write like I’m texting a friend.` }
                ];
                const now = new Date().toISOString();
                this.state.notes = samples.map(s => ({
                    id: this.generateId(), title: s.title, contentMarkdown: s.contentMarkdown, contentHtml: this.markdownToHtml(s.contentMarkdown),
                    type: s.type, tags: s.tags, project: '', goal: '', area: s.area || '', context: s.context || '', source: '',
                    dateCaptured: this.todayKey() + 'T00:00:00.000Z', lastUpdated: now, linksTo: [], favorite: !!s.favorite, keyInsight: !!s.keyInsight,
                    status: s.status || 'processed', repetitionCount: 0, patternFlags: [], sample: true
                }));
                this.saveState();
            },

            generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); },

            /* ---------- Dates (local, no timezone off-by-one) ---------- */
            todayKey(d = new Date()) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; },
            dayKey(iso) { return String(iso || '').slice(0, 10); },
            asLocalDate(iso) { return new Date(this.dayKey(iso) + 'T12:00:00'); },
            fmtDate(iso, opts = { month: 'short', day: 'numeric', year: 'numeric' }) { return this.asLocalDate(iso).toLocaleDateString(undefined, opts); },
            daysAgo(iso) { return Math.round((new Date(this.todayKey() + 'T12:00:00') - this.asLocalDate(iso)) / 86400000); },
            relDate(iso) {
                const d = this.daysAgo(iso);
                if (d === 0) return 'Today';
                if (d === 1) return 'Yesterday';
                if (d < 7) return `${d} days ago`;
                return this.fmtDate(iso);
            },

            /* ---------- Theme ---------- */
            resolvedTheme() {
                const t = this.state.settings.theme;
                if (t === 'light' || t === 'dark') return t;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            },
            applyTheme() {
                const t = this.resolvedTheme();
                document.documentElement.dataset.theme = t;
                const i = document.getElementById('theme-icon');
                if (i) i.className = `ph-duotone ph-${t === 'dark' ? 'sun' : 'moon'}`;
            },
            toggleDarkMode() {
                this.state.settings.theme = this.resolvedTheme() === 'dark' ? 'light' : 'dark';
                this.applyTheme();
                this.saveState();
                if (this.state.currentView === 'settings') this.render();
            },
            setTheme(theme) { this.state.settings.theme = theme; this.applyTheme(); this.saveState(); this.render(); },

            /* ---------- Events ---------- */
            setupEventListeners() {
                const tagInput = document.getElementById('tag-input');
                tagInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ',') {
                        e.preventDefault();
                        const value = tagInput.value.trim().replace(/,/g, '');
                        if (value) { this.addTag(value); tagInput.value = ''; }
                    } else if (e.key === 'Backspace' && !tagInput.value && this.state.editingTags.length) {
                        this.removeTag(this.state.editingTags[this.state.editingTags.length - 1]);
                    }
                });
                tagInput.addEventListener('input', () => this.updateTagSuggestions(tagInput.value));
                document.getElementById('note-content').addEventListener('input', () => { this.updateContentPreview(); this.updateTagSuggestions(''); });
                document.getElementById('note-title').addEventListener('input', () => this.updateTagSuggestions(''));

                document.addEventListener('keydown', e => {
                    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
                    const anyModal = document.querySelector('.modal.active');
                    if (e.key === 'Escape' && anyModal) {
                        anyModal.classList.remove('active');
                        if (anyModal.id === 'import-modal-temp') anyModal.remove();
                        return;
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && document.getElementById('capture-modal').classList.contains('active')) {
                        e.preventDefault();
                        document.getElementById('note-form').requestSubmit();
                        return;
                    }
                    if (typing || anyModal || e.ctrlKey || e.metaKey || e.altKey) return;
                    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); this.showCaptureModal(); }
                    else if (e.key === '/') { e.preventDefault(); this.switchView('all'); setTimeout(() => document.getElementById('search-input')?.focus(), 30); }
                    else if (e.key === 'r' || e.key === 'R') { this.switchView('review-random'); }
                });

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (this.state.settings.theme === 'system') this.applyTheme(); });
                window.addEventListener('focus', () => { if (this.sync.api && Date.now() - this.sync.lastAttempt > 60000) this.syncNow({ quiet: true }); });
            },

            /* ---------- Feedback: toasts, confetti, badges ---------- */
            toast(message, iconName = 'sparkle', pop = 'var(--c-mint)', ms = 2600) {
                const stack = document.getElementById('toasts');
                const el = document.createElement('div');
                el.className = 'toast';
                el.style.setProperty('--pop', pop);
                el.innerHTML = `${icon(iconName)}<span>${this.escapeHtml(message)}</span>`;
                stack.appendChild(el);
                while (stack.children.length > 3) stack.firstChild.remove();
                setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms);
            },

            confetti(amount = 70, originEl = null) {
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const layer = document.createElement('div');
                layer.className = 'confetti';
                const colors = ['#FFC93C', '#FF79B0', '#3FCF9E', '#FF8F5A', '#4EA8FF', '#8B5CFF', '#B9A6FF'];
                let x = window.innerWidth / 2, y = window.innerHeight * 0.45;
                if (originEl) { const r = originEl.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
                for (let i = 0; i < amount; i++) {
                    const p = document.createElement('i');
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 120 + Math.random() * 280;
                    p.style.left = x + 'px';
                    p.style.top = y + 'px';
                    p.style.background = colors[i % colors.length];
                    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                    p.style.setProperty('--dy', Math.sin(angle) * dist + 260 + 'px');
                    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
                    p.style.animationDelay = Math.random() * 0.12 + 's';
                    if (i % 3 === 0) { p.style.borderRadius = '50%'; p.style.width = p.style.height = '9px'; }
                    layer.appendChild(p);
                }
                document.body.appendChild(layer);
                setTimeout(() => layer.remove(), 1900);
            },

            realNoteCount() { return this.state.notes.filter(n => !n.sample).length; },

            checkMilestone() {
                const count = this.realNoteCount();
                const hit = BADGES.filter(b => count >= b.at).pop();
                if (hit && hit.at > (this.state.settings.lastMilestone || 0)) {
                    this.state.settings.lastMilestone = hit.at;
                    this.saveState();
                    setTimeout(() => this.showBadge(hit, true), 450);
                    return true;
                }
                return false;
            },

            showBadge(badge, fresh = false) {
                const count = this.realNoteCount();
                const earned = count >= badge.at;
                const box = document.getElementById('badge-content');
                box.innerHTML = `
                    ${earned ? '<div class="rays"></div>' : ''}
                    <div class="kicker">${earned ? (fresh ? 'Badge unlocked!' : 'Badge earned') : 'Up next'}</div>
                    ${art(badge.art)}
                    <h2>${badge.name}</h2>
                    <p class="text-muted mt-1">${earned ? badge.line : `Capture ${badge.at - count} more note${badge.at - count === 1 ? '' : 's'} to unlock.`}</p>
                    <div class="mt-2"><button class="btn ${earned ? 'btn-pop' : 'btn-outline'}" onclick="app.closeBadge()">${earned ? 'Heck yes' : 'On it'}</button></div>`;
                if (!earned) box.querySelector('.art').style.filter = 'grayscale(1) opacity(.4)';
                document.getElementById('badge-modal').classList.add('active');
                if (fresh) { this.confetti(150); }
            },
            closeBadge() { document.getElementById('badge-modal').classList.remove('active'); },

            /* ---------- Markdown (escaped; safe links only) ---------- */
            markdownToHtml(markdown) {
                let html = String(markdown || '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
                html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
                html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => /^(https?:|mailto:)/i.test(url) ? `<a href="${url}" target="_blank" rel="noopener">${text}</a>` : text);
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                const out = [];
                let list = null;
                for (const line of html.split('\n')) {
                    const ul = line.match(/^[*-] (.+)/);
                    const ol = line.match(/^\d+\. (.+)/);
                    if (ul || ol) {
                        const kind = ul ? 'ul' : 'ol';
                        if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
                        out.push(`<li>${(ul || ol)[1]}</li>`);
                    } else {
                        if (list) { out.push(`</${list}>`); list = null; }
                        out.push(line);
                    }
                }
                if (list) out.push(`</${list}>`);
                return out.join('\n').split('\n\n').map(para => {
                    para = para.trim();
                    if (!para) return '';
                    if (/^<(h\d|ul|ol|blockquote)/.test(para)) return para;
                    return `<p>${para.replace(/\n/g, '<br>')}</p>`;
                }).join('\n');
            },

            escapeHtml(text) { return String(text ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]); },

            /* ---------- Tags in the capture form ---------- */
            addTag(tag) {
                tag = String(tag).trim().replace(/^#/, '');
                if (tag && !this.state.editingTags.includes(tag)) { this.state.editingTags.push(tag); this.renderTagInput(); this.updateTagSuggestions(''); }
            },
            removeTag(tag) { this.state.editingTags = this.state.editingTags.filter(t => t !== tag); this.renderTagInput(); this.updateTagSuggestions(''); },
            renderTagInput() {
                const container = document.getElementById('tag-container');
                const input = document.getElementById('tag-input');
                container.querySelectorAll('.tag-item').forEach(el => el.remove());
                this.state.editingTags.forEach(tag => {
                    const el = document.createElement('span');
                    el.className = 'tag-item';
                    el.style.setProperty('--tc', tagColor(tag));
                    el.innerHTML = `${this.escapeHtml(tag)}<button type="button" class="tag-remove" aria-label="Remove tag">×</button>`;
                    el.querySelector('button').onclick = () => this.removeTag(tag);
                    container.insertBefore(el, input);
                });
            },
            updateTagSuggestions(input) {
                const allTags = new Set();
                this.state.notes.forEach(n => n.tags.forEach(t => allTags.add(t)));
                const text = document.getElementById('note-title').value + ' ' + document.getElementById('note-content').value;
                const suggested = [...new Set([...this.extractKeywords(text), ...allTags])]
                    .filter(t => !this.state.editingTags.includes(t) && (!input || t.toLowerCase().includes(input.toLowerCase()))).slice(0, 8);
                document.getElementById('suggested-tags-container').innerHTML = suggested.length ? `<div class="auto-suggest">Try: ${suggested.map(t =>
                    `<button type="button" class="suggested-tag" data-tag="${this.escapeHtml(t)}" onclick="app.addTag(this.dataset.tag)">+ ${this.escapeHtml(t)}</button>`).join('')}</div>` : '';
            },
            extractKeywords(text) {
                const keywords = new Set();
                const lower = text.toLowerCase();
                (text.match(/\b[A-Z][a-z]{3,}\b/g) || []).slice(0, 4).forEach(w => keywords.add(w.toLowerCase()));
                ['strategy', 'creativity', 'productivity', 'client', 'branding', 'money', 'design', 'marketing', 'business', 'content', 'systems',
                 'boundaries', 'pricing', 'energy', 'focus', 'clarity', 'adhd', 'family'].forEach(t => { if (lower.includes(t)) keywords.add(t); });
                return [...keywords];
            },

            /* ---------- Capture form ---------- */
            renderTemplateButtons() {
                const t = ['idea', 'learning', 'decision', 'book', 'meeting', 'voice'];
                document.getElementById('template-buttons').innerHTML = `<span class="lbl">Start from:</span>
                    <button type="button" class="filter-chip" onclick="app.applyTemplate('blank')">${icon('file-dashed')} Blank</button>` +
                    t.map(k => { const m = typeMeta(k); return `<button type="button" class="filter-chip" style="--type:${m.color}" onclick="app.applyTemplate('${k}')">${icon(m.icon)} ${m.label}</button>`; }).join('');
            },
            renderTypePicker() {
                const current = document.getElementById('note-type').value;
                const keys = ['idea', 'learning', 'insight', 'decision', 'book', 'meeting', 'voice', 'quote', 'reference', 'resource'];
                if (!keys.includes(current)) keys.push(current);
                document.getElementById('type-picker').innerHTML = keys.map(k => {
                    const m = typeMeta(k);
                    return `<button type="button" class="type-option ${k === current ? 'active' : ''}" style="--type:${m.color}" onclick="app.setType('${k}')">${icon(m.icon)} ${m.label}</button>`;
                }).join('');
                document.getElementById('capture-content').style.setProperty('--type', typeMeta(current).color);
            },
            setType(type) { document.getElementById('note-type').value = type; this.renderTypePicker(); },

            applyTemplate(type) {
                const templates = {
                    blank: { title: '', content: '' },
                    idea: { title: 'New Idea', content: `## The Idea\n\n## Why This Matters\n\n## Where It Fits\n(Project/goal?)\n\n## Next Step\n(One tiny action)` },
                    learning: { title: 'Something I Learned', content: `## What I Learned\n\n## Where This Came From\n\n## How/Where to Use It\n\n## What Gets in the Way` },
                    decision: { title: 'Decision Log', content: `**Decision:**\n\n**Options I Considered:**\n\n**Why I Chose This:**\n\n**Expected Outcome:**\n\n**What to Watch For:**` },
                    book: { title: 'Book Notes', content: `**Book:**\n**Author:**\n**Date Read:**\n\n## Key Takeaways\n\n## Quotes Worth Keeping\n\n## How to Apply This\n\n## One Thing I'll Try` },
                    meeting: { title: 'Meeting Notes', content: `**Date:**\n**Who Was There:**\n**Purpose:**\n\n## What We Talked About\n\n## Decisions Made\n\n## Action Items\n\n## Follow-Ups` },
                    voice: { title: 'Brain Dump – ' + new Date().toLocaleString(), content: `Dump it all here. Sort it out later.\n\n## Key Points\n\n## What to Do With This` }
                };
                const t = templates[type] || templates.blank;
                document.getElementById('note-title').value = t.title;
                document.getElementById('note-content').value = t.content;
                if (type !== 'blank') this.setType(type);
                this.updateContentPreview();
                this.updateTagSuggestions('');
                const content = document.getElementById('note-content');
                content.focus();
                const firstGap = t.content.indexOf('\n\n');
                if (firstGap > -1) content.setSelectionRange(firstGap + 1, firstGap + 1);
            },

            togglePreview(mode) {
                const textarea = document.getElementById('note-content');
                const preview = document.getElementById('content-preview');
                const buttons = document.querySelectorAll('.preview-toggle button');
                buttons.forEach(b => b.classList.remove('active'));
                const show = mode === 'preview';
                textarea.classList.toggle('hidden', show);
                preview.classList.toggle('hidden', !show);
                buttons[show ? 1 : 0].classList.add('active');
                if (show) this.updateContentPreview();
            },
            updateContentPreview() { document.getElementById('content-preview').innerHTML = this.markdownToHtml(document.getElementById('note-content').value); },

            showCaptureModal(noteId = null, templateType = null) {
                document.getElementById('note-form').reset();
                document.getElementById('note-id').value = '';
                this.state.editingTags = [];
                this.togglePreview('edit');
                this.renderTemplateButtons();
                document.getElementById('more-details').open = false;
                const saveBtn = document.getElementById('save-btn');
                const note = noteId && this.state.notes.find(n => n.id === noteId);
                if (note) {
                    document.getElementById('modal-title').textContent = 'Edit note';
                    document.getElementById('modal-sub').textContent = 'Polish it, link it, make it useful.';
                    saveBtn.innerHTML = `${icon('check-circle')} Save changes`;
                    document.getElementById('template-buttons').classList.add('hidden');
                    document.getElementById('note-id').value = note.id;
                    document.getElementById('note-title').value = note.title;
                    document.getElementById('note-content').value = note.contentMarkdown;
                    document.getElementById('note-type').value = note.type;
                    document.getElementById('note-project').value = note.project || '';
                    document.getElementById('note-goal').value = note.goal || '';
                    document.getElementById('note-area').value = note.area || '';
                    document.getElementById('note-context').value = note.context || '';
                    document.getElementById('note-source').value = note.source || '';
                    document.getElementById('note-date').value = this.dayKey(note.dateCaptured);
                    document.getElementById('note-favorite').checked = !!note.favorite;
                    document.getElementById('note-key-insight').checked = !!note.keyInsight;
                    this.state.editingTags = [...note.tags];
                    if (note.project || note.goal || note.area || note.context || note.source) document.getElementById('more-details').open = true;
                } else {
                    document.getElementById('modal-title').textContent = 'What did your brain bump into today?';
                    document.getElementById('modal-sub').textContent = 'Messy is fine. You can tidy it up later.';
                    saveBtn.innerHTML = `${icon('sparkle')} Save &amp; don’t forget`;
                    document.getElementById('template-buttons').classList.remove('hidden');
                    document.getElementById('note-date').value = this.todayKey();
                    document.getElementById('note-type').value = this.state.settings.defaultType || 'idea';
                    document.getElementById('note-area').value = this.state.settings.defaultArea || '';
                }
                this.renderTypePicker();
                this.renderTagInput();
                this.updateTagSuggestions('');
                this.updateDataLists();
                document.getElementById('capture-modal').classList.add('active');
                if (templateType) this.applyTemplate(templateType);
                else setTimeout(() => document.getElementById('note-title').focus(), 80);
            },
            closeCaptureModal() { document.getElementById('capture-modal').classList.remove('active'); },

            updateDataLists() {
                const projects = new Set(), goals = new Set();
                this.state.notes.forEach(n => { if (n.project) projects.add(n.project); if (n.goal) goals.add(n.goal); });
                document.getElementById('projects-list').innerHTML = [...projects].map(p => `<option value="${this.escapeHtml(p)}">`).join('');
                document.getElementById('goals-list').innerHTML = [...goals].map(g => `<option value="${this.escapeHtml(g)}">`).join('');
            },

            saveNote(event) {
                event.preventDefault();
                const val = id => document.getElementById(id).value;
                const pendingTag = val('tag-input').trim();
                if (pendingTag) { this.addTag(pendingTag); document.getElementById('tag-input').value = ''; }
                const id = val('note-id');
                const existing = id && this.state.notes.find(n => n.id === id);
                const contentMarkdown = val('note-content');
                const noteData = {
                    title: val('note-title').trim() || 'Untitled', contentMarkdown, contentHtml: this.markdownToHtml(contentMarkdown),
                    type: val('note-type') || 'idea', tags: [...this.state.editingTags],
                    project: val('note-project').trim(), goal: val('note-goal').trim(), area: val('note-area'), context: val('note-context'), source: val('note-source').trim(),
                    dateCaptured: (val('note-date') || this.todayKey()) + 'T00:00:00.000Z', lastUpdated: new Date().toISOString(),
                    favorite: document.getElementById('note-favorite').checked, keyInsight: document.getElementById('note-key-insight').checked, dirty: true
                };
                let note;
                if (existing) {
                    Object.assign(existing, noteData);
                    delete existing.sample;
                    note = existing;
                } else {
                    note = { ...noteData, id: this.generateId(), linksTo: [], status: 'unprocessed', repetitionCount: 0, patternFlags: [] };
                    this.state.notes.unshift(note);
                }
                this.detectPatterns(note);
                this.saveState();
                this.closeCaptureModal();
                this.renderNav();
                this.render();
                if (!existing) {
                    if (!this.checkMilestone()) {
                        const [ic, msg] = SAVE_CHEERS[Math.floor(Math.random() * SAVE_CHEERS.length)];
                        this.confetti(50, document.querySelector('.fab'));
                        this.toast(msg, ic, typeMeta(note.type).color);
                    }
                } else {
                    this.toast('Changes saved', 'pencil-simple', 'var(--c-sky)');
                }
                this.pushNote(note);
            },

            deleteNote(id) {
                const note = this.state.notes.find(n => n.id === id);
                if (!note) return;
                const where = note.notionId && this.sync.api ? ' It moves to Notion’s trash, where you can restore it.' : ' This can’t be undone.';
                if (!confirm(`Delete “${note.title}”?${where}`)) return;
                this.state.notes = this.state.notes.filter(n => n.id !== id);
                this.state.notes.forEach(n => { n.linksTo = (n.linksTo || []).filter(l => l !== id); });
                if (note.notionId && this.sync.api) { this.state.pendingDeletes.push(note.notionId); this.enqueue(() => this.flushDeletes()); }
                this.saveState();
                this.closeDetailModal();
                this.renderNav();
                this.render();
                this.toast('Note deleted', 'trash', 'var(--c-slate)');
            },

            toggleFavorite(id, el) {
                const note = this.state.notes.find(n => n.id === id);
                if (!note) return;
                note.favorite = !note.favorite;
                note.dirty = true;
                this.saveState();
                document.querySelectorAll(`.favorite-star[data-id="${id}"]`).forEach(star => {
                    star.classList.toggle('active', note.favorite);
                    star.querySelector('i').className = `ph-duotone ph-star`;
                    star.classList.remove('pop'); void star.offsetWidth; star.classList.add('pop');
                    star.setAttribute('aria-pressed', note.favorite);
                });
                if (note.favorite) this.confetti(18, el);
                this.pushNote(note);
            },

            markProcessed(id, el) {
                const note = this.state.notes.find(n => n.id === id);
                if (!note) return;
                note.status = 'processed';
                note.lastUpdated = new Date().toISOString();
                note.dirty = true;
                this.saveState();
                const left = this.state.notes.filter(n => n.status === 'unprocessed').length;
                if (left === 0) { this.confetti(160); this.toast('Inbox zero! Every note has some love.', 'confetti', 'var(--c-sun)', 4000); }
                else { this.confetti(30, el); this.toast(`Processed. ${left} to go.`, 'check-circle', 'var(--c-mint)'); }
                this.renderNav();
                this.render();
                if (document.getElementById('detail-modal').classList.contains('active')) this.showNoteDetail(id);
                this.pushNote(note);
            },

            /* ---------- Patterns & relations ---------- */
            detectPatterns(newNote) {
                const similar = this.state.notes.filter(n => {
                    if (n.id === newNote.id) return false;
                    const shared = n.tags.filter(t => newNote.tags.includes(t)).length;
                    return shared >= 2 || this.calculateSimilarity(n.title, newNote.title) > 0.5 ||
                        this.calculateSimilarity(n.contentMarkdown.slice(0, 200), newNote.contentMarkdown.slice(0, 200)) > 0.4;
                });
                newNote.repetitionCount = similar.length;
                newNote.patternFlags = similar.map(n => n.id);
            },
            calculateSimilarity(a, b) {
                if (!a || !b) return 0;
                const w1 = a.toLowerCase().split(/\s+/), w2 = b.toLowerCase().split(/\s+/);
                return w1.filter(w => w.length > 3 && w2.includes(w)).length / Math.max(w1.length, w2.length, 1);
            },
            getRelatedNotes(noteId, limit = 5) {
                const note = this.state.notes.find(n => n.id === noteId);
                if (!note) return [];
                return this.state.notes.filter(n => n.id !== noteId).map(n => ({ n, s: this.calculateRelatedness(note, n) }))
                    .filter(x => x.s > 1).sort((a, b) => b.s - a.s).slice(0, limit).map(x => x.n);
            },
            calculateRelatedness(a, b) {
                let s = a.tags.filter(t => b.tags.includes(t)).length * 5;
                if (a.type === b.type) s += 2;
                if (a.project && a.project === b.project) s += 8;
                if (a.goal && a.goal === b.goal) s += 6;
                if (a.area && a.area === b.area) s += 1;
                return s + this.calculateSimilarity(a.contentMarkdown, b.contentMarkdown) * 10;
            },
            getLinkedFrom(noteId) { return this.state.notes.filter(n => (n.linksTo || []).includes(noteId)); },

            searchNotes(query, filters = {}) {
                let results = this.state.notes;
                if (query) {
                    const q = query.toLowerCase();
                    results = results.map(note => {
                        let score = 0;
                        const title = note.title.toLowerCase(), content = note.contentMarkdown.toLowerCase();
                        if (title.includes(q)) score += 10;
                        if (note.tags.some(t => t.toLowerCase().includes(q))) score += 8;
                        if (content.slice(0, 200).includes(q)) score += 5;
                        if (content.includes(q)) score += 2;
                        if (note.project && note.project.toLowerCase().includes(q)) score += 6;
                        if (note.goal && note.goal.toLowerCase().includes(q)) score += 6;
                        return { note, score };
                    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).map(x => x.note);
                }
                if (filters.type) results = results.filter(n => n.type === filters.type);
                if (filters.tag) results = results.filter(n => n.tags.includes(filters.tag));
                if (filters.favorite) results = results.filter(n => n.favorite);
                if (filters.project) results = results.filter(n => n.project === filters.project);
                return results;
            },

            getStats() {
                const n = this.state.notes;
                return {
                    total: n.length, favorites: n.filter(x => x.favorite).length,
                    unprocessed: n.filter(x => x.status === 'unprocessed').length, processed: n.filter(x => x.status === 'processed').length
                };
            },

            // Consecutive days with a capture, ending today (or yesterday, so the streak is still alive)
            getStreak() {
                const days = new Set(this.state.notes.filter(n => !n.sample).map(n => this.dayKey(n.dateCaptured)));
                const d = new Date();
                if (!days.has(this.todayKey(d))) d.setDate(d.getDate() - 1);
                let streak = 0;
                while (days.has(this.todayKey(d))) { streak++; d.setDate(d.getDate() - 1); }
                return { streak, today: days.has(this.todayKey()) };
            },

            /* ---------- Navigation & render ---------- */
            renderNav() {
                const active = this.state.currentView.split('-')[0];
                document.getElementById('nav').innerHTML = NAV.map(item => {
                    const c = item.count ? item.count(this.state) : null;
                    const badge = c ? `<span class="nav-count ${item.hot ? 'hot' : ''}">${c}</span>` : '';
                    return `<button class="nav-btn ${active === item.view ? 'active' : ''}" style="--nav-c:${item.c}" onclick="app.switchView('${item.view}')">${icon(item.icon)}${item.label}${badge}</button>`;
                }).join('');
            },

            switchView(view) {
                if (view !== 'all') this.state.filters = {};
                if (view !== this.state.currentView || view === 'review-random') this.state.searchQuery = '';
                this.state.currentView = view;
                this.renderNav();
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.querySelector('.nav-btn.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            },

            render() {
                const main = document.getElementById('main-content');
                const views = {
                    'home': () => this.renderHomeView(), 'all': () => this.renderAllNotesView(), 'unprocessed': () => this.renderUnprocessedView(),
                    'timeline': () => this.renderTimelineView(), 'projects': () => this.renderProjectsView(), 'tags': () => this.renderTagCloudView(),
                    'review': () => this.renderReviewView(), 'review-weekly': () => this.renderWeeklyReview(), 'review-monthly': () => this.renderMonthlyReview(),
                    'review-quarterly': () => this.renderQuarterlyReview(), 'review-random': () => this.renderRandomNote(),
                    'reading': () => this.renderReadingListView(), 'someday': () => this.renderSomedayView(), 'settings': () => this.renderSettingsView()
                };
                main.innerHTML = `<div class="view">${(views[this.state.currentView] || views.home)()}</div>`;
                this.animateCounts();
                if (this.state.currentView === 'all') {
                    const input = document.getElementById('search-input');
                    if (input && this.state.searchQuery) input.value = this.state.searchQuery;
                    this.renderResults();
                }
            },

            animateCounts() {
                const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                document.querySelectorAll('[data-count]').forEach(el => {
                    const target = Number(el.dataset.count);
                    if (reduce || target === 0) { el.textContent = target; return; }
                    const start = performance.now(), dur = 750;
                    const step = now => { const t = Math.min(1, (now - start) / dur); el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3))); if (t < 1) requestAnimationFrame(step); };
                    requestAnimationFrame(step);
                });
                document.querySelectorAll('.ring .fill[data-pct]').forEach(c => {
                    requestAnimationFrame(() => requestAnimationFrame(() => { c.style.strokeDashoffset = c.dataset.circ * (1 - c.dataset.pct / 100); }));
                });
            },

            viewHead(title, sub, artKey = '', extra = '') {
                return `<div class="view-head">${artKey ? art(artKey, 'float') : ''}<div><h2>${title}${extra}</h2>${sub ? `<p>${sub}</p>` : ''}</div></div>`;
            },
            backBtn(view, label) { return `<button class="btn btn-outline btn-small mb-3" onclick="app.switchView('${view}')">${icon('arrow-left', 'bold')} ${label}</button>`; },
            emptyState(artKey, title, line, hand = '', action = '') {
                return `<div class="empty-state">${art(artKey)}${title ? `<h3>${title}</h3>` : ''}<p>${line}</p>${hand ? `<p class="hand mt-1">${hand}</p>` : ''}${action}</div>`;
            },

            greeting() {
                const h = new Date().getHours();
                const part = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
                const name = this.state.settings.name ? `, ${this.escapeHtml(this.state.settings.name)}` : '';
                return `${part}${name}`;
            },

            shuffleSpark() {
                this.state.sparkIndex = (this.state.sparkIndex + 1 + Math.floor(Math.random() * (SPARKS.length - 1))) % SPARKS.length;
                const el = document.getElementById('spark');
                if (el) { el.style.opacity = 0; setTimeout(() => { el.textContent = SPARKS[this.state.sparkIndex]; el.style.opacity = 1; }, 150); }
            },

            renderBadgeShelf() {
                const count = this.realNoteCount();
                const nextIdx = BADGES.findIndex(b => count < b.at);
                const shown = BADGES.slice(0, Math.max(6, nextIdx + 2));
                return shown.map((b, i) => {
                    const earned = count >= b.at;
                    const isNext = i === nextIdx;
                    const prev = i ? BADGES[i - 1].at : 0;
                    const pct = Math.max(0, Math.min(100, ((count - prev) / (b.at - prev)) * 100));
                    return `<button class="badge ${earned ? 'earned' : 'locked'} ${isNext ? 'next' : ''}" onclick="app.showBadge(BADGES[${i}])" title="${b.name}">
                        ${earned ? '' : `<span class="lock">${icon('lock-simple')}</span>`}
                        ${art(b.art)}
                        <strong>${b.name}</strong>
                        <small>${earned ? 'Earned' : `${b.at} note${b.at > 1 ? 's' : ''}`}</small>
                        ${isNext ? `<div class="progress-line"><span style="width:${pct}%"></span></div>` : ''}
                    </button>`;
                }).join('');
            },

            renderHomeView() {
                const stats = this.getStats();
                const { streak, today } = this.getStreak();
                const recent = [...this.state.notes].sort((a, b) => (b.lastUpdated || '').localeCompare(a.lastUpdated || '')).slice(0, 4);
                const patterns = this.state.notes.filter(n => n.repetitionCount > 2);
                const pct = stats.total ? Math.round(stats.processed / stats.total * 100) : 0;

                    ${this.state.settings.showDailyCapture ? `

                                <button class="btn btn-pop" onclick="app.showCaptureModal()">${icon('plus', 'bold')} Capture it</button>
                                <button class="btn btn-ghost" onclick="app.switchView('review-random')">${icon('dice-five')} Surprise me</button>
                                <button class="shuffle-spark" onclick="app.shuffleSpark()">${icon('shuffle', 'bold')} new prompt</button>
                            </div>
                        </div>
                        <div class="hero-art" aria-hidden="true">
                            ${art('cloud', 'cloud a')}${art('brainIdea', 'main')}${art('sunCloud', 'cloud b')}
                        </div>
                    </section>` : ''}

                    ${hasSamples ? `

                        <button class="btn btn-outline btn-small" onclick="app.switchView('settings')">${icon('plugs-connected')} Connect Notion</button>
                    </div>` : ''}

                    <div class="stats">
                        <button class="stat-card" style="--pop:var(--c-sky)" onclick="app.switchView('all')">
                            ${art('folder')}<div><div class="stat-value" data-count="${stats.total}">${stats.total}</div><div class="stat-label">Notes in your brain</div></div>
                        </button>
