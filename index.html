                            ${art('candle')}<div><div class="stat-value" data-count="${streak}">${streak}</div>
                            <div class="stat-label">${streak ? (today ? 'Day streak. Keep it lit!' : 'Day streak. Capture today to keep it lit!') : 'Capture today to light a streak'}</div></div>
                        </div>
                        <button class="stat-card" style="--pop:var(--c-violet)" onclick="app.filterFavorites()">
                            ${art('moon')}<div><div class="stat-value" data-count="${stats.favorites}">${stats.favorites}</div><div class="stat-label">Starred</div></div>
                        </button>
                        <button class="stat-card" style="--pop:var(--c-pink)" onclick="app.switchView('unprocessed')">
                            ${art('heartBrain')}<div><div class="stat-value" data-count="${stats.unprocessed}">${stats.unprocessed}</div><div class="stat-label">Need some love</div></div>
                        </button>
                    </div>

                    ${stats.total === 0 ? `<div class="card">${this.emptyState('island', 'A blank little world', 'Plant the first thought. Pick a starter below, or press <span class="kbd">N</span> anytime.', 'it only takes 30 seconds →')}</div>` : ''}

                    <div class="section-title"><h3>Start a note</h3><span class="text-muted" style="font-size:.86rem">Templates do the thinking-structure for you</span></div>
                    <div class="grid-tiles" style="margin-bottom:1.25rem">
                        ${[['idea', 'Catch a spark'], ['learning', 'Lock in a lesson'], ['decision', 'Log the why'], ['meeting', 'Who said what'], ['book', 'Keep the good bits'], ['voice', 'Empty your head']].map(([k, sub]) => {
                            const m = typeMeta(k);
                            return `<button class="quick-tile" style="--type:${m.color}" onclick="app.showCaptureModal(null,'${k}')">${art(m.art)}<strong>${k === 'voice' ? 'Brain dump' : m.label}</strong><small>${sub}</small></button>`;
                        }).join('')}
                    </div>

                    ${stats.total ? `
                    <div class="grid-2">
                        <div class="card ring-card">
                            <svg class="ring" viewBox="0 0 84 84" aria-hidden="true">
                                <circle class="track" cx="42" cy="42" r="32"/>
                                <circle class="fill" cx="42" cy="42" r="32" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" data-circ="${circ}" data-pct="${pct}"/>
                                <text x="42" y="48" text-anchor="middle">${pct}%</text>
                            </svg>
                            <div>
                                <h3>Processed</h3>
                                <p class="text-muted" style="font-size:.92rem">${stats.unprocessed ? `${stats.unprocessed} note${stats.unprocessed > 1 ? 's' : ''} waiting for tags or a quick review.` : 'Everything’s been looked at. Future you says thanks.'}</p>
                                ${stats.unprocessed ? `<button class="btn btn-outline btn-small mt-1" onclick="app.switchView('unprocessed')">${icon('heart')} Give them love</button>` : ''}
                            </div>
                        </div>
                        ${patterns.length ? `
                        <div class="card" style="border-left:5px solid var(--c-tangerine)">
                            <h3 class="mb-1">${icon('arrows-clockwise')} Patterns you keep seeing</h3>
                            <p class="text-muted mb-1" style="font-size:.9rem">Maybe time to act on these instead of capturing them again?</p>
                            ${patterns.slice(0, 3).map(n => `<div class="link-item" onclick="app.showNoteDetail('${n.id}')"><strong>${this.escapeHtml(n.title)}</strong> <span class="text-muted" style="font-size:.8rem">· seen ${n.repetitionCount}×</span></div>`).join('')}
                        </div>` : `
                        <div class="card card-clickable review-tile" style="--pop:var(--c-violet);min-height:0" onclick="app.switchView('review')">
                            ${art('dreamcatcher')}<h3>Review &amp; resurface</h3><p class="text-muted" style="font-size:.9rem;max-width:70%">Notes only help if you see them again.</p>
                        </div>`}
                    </div>` : ''}

                    <div class="section-title"><h3>Badge shelf</h3><span class="text-muted" style="font-size:.86rem">${this.realNoteCount()} note${this.realNoteCount() === 1 ? '' : 's'} captured</span></div>
                    <div class="badge-shelf">${this.renderBadgeShelf()}</div>

                    ${stats.total ? `
                    <div class="section-title"><h3>Recently touched</h3><button class="btn btn-ghost btn-small" onclick="app.switchView('all')">See all ${icon('arrow-right', 'bold')}</button></div>
                    ${recent.map(n => this.renderNoteCard(n)).join('')}` : ''}
                `;
            },

            filterFavorites() { this.state.currentView = 'all'; this.state.filters = { favorite: true }; this.renderNav(); this.render(); },

            renderAllNotesView() {
                const f = this.state.filters;
                const typesInUse = [...new Set(this.state.notes.map(n => n.type))];
                const chips = [`<button class="filter-chip ${!f.type && !f.favorite ? 'active' : ''}" onclick="app.setFilter(null)">All</button>`,
                    `<button class="filter-chip ${f.favorite ? 'active' : ''}" style="--type:var(--c-sun)" onclick="app.setFilter('favorite')">${icon('star')} Starred</button>`,
                    ...typesInUse.map(t => { const m = typeMeta(t); return `<button class="filter-chip ${f.type === t ? 'active' : ''}" style="--type:${m.color}" onclick="app.setFilter('${this.escapeHtml(t)}')">${icon(m.icon)} ${this.escapeHtml(m.label)}</button>`; })];
                return `
                    ${f.tag ? this.viewHead(`<span class="tag" style="--tc:${tagColor(f.tag)};font-size:1.3rem;padding:.3rem .95rem">${this.escapeHtml(f.tag)}</span>`, 'Notes with this tag', 'colorWheel') + this.backBtn('tags', 'All tags')
                            : f.project ? this.viewHead(this.escapeHtml(f.project), 'Notes in this project', 'cloudFolder') + this.backBtn('projects', 'All projects')
                            : this.viewHead('All notes', 'Everything your brain has bumped into.', 'folder')}
                    <div class="search-box">
                        <input type="text" class="search-input" id="search-input" placeholder="Search titles, tags, projects, content…" oninput="app.handleSearch(this.value)" aria-label="Search notes">
                        <span class="kbd">/</span>
                    </div>
                    ${!f.tag && !f.project ? `<div class="filter-row">${chips.join('')}</div>` : ''}
                    <div id="results"></div>
                `;
            },

            setFilter(kind) {
                if (!kind) this.state.filters = {};
                else if (kind === 'favorite') this.state.filters = this.state.filters.favorite ? {} : { favorite: true };
                else this.state.filters = this.state.filters.type === kind ? {} : { type: kind };
                this.render();
            },
            handleSearch(query) { this.state.searchQuery = query; this.renderResults(); },
            renderResults() {
                const box = document.getElementById('results');
                if (!box) return;
                const q = this.state.searchQuery;
                const results = this.searchNotes(q, this.state.filters);
                if (this.state.notes.length === 0) {
                    box.innerHTML = this.emptyState('island', 'Nothing here yet', 'Your brain is a blank little world.', 'plant the first thought →',
                        `<button class="btn btn-primary mt-2" onclick="app.showCaptureModal()">${icon('plus', 'bold')} Add your first note</button>`);
                    return;
                }
                box.innerHTML = (q || Object.keys(this.state.filters).length ? `<p class="result-count">${results.length} note${results.length === 1 ? '' : 's'}${q ? ` for “${this.escapeHtml(q)}”` : ''}</p>` : '') +
                    (results.length ? results.map(n => this.renderNoteCard(n)).join('') : this.emptyState('door', 'Nothing behind this door', 'Try fewer words, or a tag name.'));
            },

            renderUnprocessedView() {
                const list = this.state.notes.filter(n => n.status === 'unprocessed');
                return `
                    ${this.viewHead('Needs love', 'Add tags, link to a project, or just give it a read and mark it processed.', 'heartBrain', list.length ? ` <span class="hand">${list.length} to go!</span>` : '')}
                    ${list.length === 0 ? this.emptyState('lotus', 'All caught up', 'Every note has been processed.', 'deep breath. future you says thanks ✿') : list.map(n => this.renderNoteCard(n, true)).join('')}
                `;
            },

            renderNoteCard(note, showProcess = false) {
                const m = typeMeta(note.type);
                const preview = note.contentMarkdown.replace(/[#*>`_\-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 220);
                return `
                    <article class="card card-clickable note-card" style="--type:${m.color}" onclick="app.showNoteDetail('${note.id}')">
                        <div class="note-header">
                            <div style="flex:1;min-width:0">
                                <div class="note-title">${this.escapeHtml(note.title)}</div>
                                <div class="note-meta">
                                    <span class="note-type">${icon(m.icon)} ${this.escapeHtml(m.label)}</span>
                                    ${note.keyInsight ? `<span>${icon('lightbulb')} Key insight</span>` : ''}
                                    ${note.project ? `<span>${icon('folder-simple')} ${this.escapeHtml(note.project)}</span>` : ''}
                                    ${note.goal ? `<span>${icon('target')} ${this.escapeHtml(note.goal)}</span>` : ''}
                                    <span>${this.relDate(note.dateCaptured)}</span>
                                    ${note.sample ? '<span class="chip-sample">sample</span>' : ''}
                                    ${note.dirty && this.sync.api ? `<span class="chip-unsynced" title="Not in Notion yet">${icon('cloud-arrow-up')} not synced</span>` : ''}
                                </div>
                            </div>
                            <button class="favorite-star ${note.favorite ? 'active' : ''}" data-id="${note.id}" aria-pressed="${!!note.favorite}" aria-label="Star"
                                onclick="event.stopPropagation(); app.toggleFavorite('${note.id}', this)"><i class="ph-duotone ph-star"></i></button>
                        </div>
                        ${preview ? `<div class="note-content-preview">${this.escapeHtml(preview)}</div>` : ''}
                        ${note.tags.length ? `<div class="tags">${note.tags.map(t => this.tagChip(t)).join('')}</div>` : ''}
                        ${note.repetitionCount > 2 ? `<div class="pattern-alert"><div class="pattern-alert-title">${icon('arrows-clockwise')} You’ve seen this ${note.repetitionCount} times</div>Maybe it’s time to actually do something about it?</div>` : ''}
                        ${showProcess ? `<button class="btn btn-small btn-primary mt-2" onclick="event.stopPropagation(); app.markProcessed('${note.id}', this)">${icon('check', 'bold')} Mark processed</button>` : ''}
                    </article>`;
            },

            tagChip(tag, stop = true) {
                return `<span class="tag" style="--tc:${tagColor(tag)}" data-tag="${this.escapeHtml(tag)}" onclick="${stop ? 'event.stopPropagation(); ' : ''}app.filterByTag(this.dataset.tag)">${this.escapeHtml(tag)}</span>`;
            },

            showNoteDetail(noteId) {
                const note = this.state.notes.find(n => n.id === noteId);
                if (!note) return;
                const m = typeMeta(note.type);
                const related = this.getRelatedNotes(noteId);
                const linkedFrom = this.getLinkedFrom(noteId);
                const linkedTo = this.state.notes.filter(n => (note.linksTo || []).includes(n.id));
                const content = document.getElementById('detail-content');
                content.style.setProperty('--type', m.color);
                const linkRow = n => `<div class="link-item" style="--type:${typeMeta(n.type).color}" onclick="app.showNoteDetail('${n.id}')">${icon(typeMeta(n.type).icon)} ${this.escapeHtml(n.title)}</div>`;
                content.innerHTML = `
                    <div class="modal-header">
                        <div style="min-width:0">
                            <div class="note-meta mb-1">
                                <span class="note-type">${icon(m.icon)} ${this.escapeHtml(m.label)}</span>
                                <span>${this.fmtDate(note.dateCaptured, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}</span>
                                ${note.status === 'processed' ? `<span>${icon('check-circle')} processed</span>` : `<span style="color:var(--c-pink);font-weight:600">${icon('heart')} needs love</span>`}
                            </div>
                            <h2 class="modal-title">${this.escapeHtml(note.title)}</h2>
                        </div>
                        <div style="display:flex;gap:.4rem;align-items:center">
                            <button class="favorite-star ${note.favorite ? 'active' : ''}" data-id="${note.id}" aria-pressed="${!!note.favorite}" aria-label="Star" onclick="app.toggleFavorite('${note.id}', this)"><i class="ph-duotone ph-star"></i></button>
                            <button class="modal-close" onclick="app.closeDetailModal()" aria-label="Close">${icon('x', 'bold')}</button>
                        </div>
                    </div>
                    <div class="note-meta mb-2">
                        ${note.keyInsight ? `<span>${icon('lightbulb')} Key insight</span>` : ''}
                        ${note.project ? `<span class="tag plain" style="--tc:var(--c-violet)" data-project="${this.escapeHtml(note.project)}" onclick="app.filterByProject(this.dataset.project)">${icon('folder-simple')}&nbsp;${this.escapeHtml(note.project)}</span>` : ''}
                        ${note.goal ? `<span>${icon('target')} ${this.escapeHtml(note.goal)}</span>` : ''}
                        ${note.area ? `<span>${icon('map-pin')} ${this.escapeHtml(note.area)}</span>` : ''}
                        ${note.context ? `<span>${icon('compass')} ${this.escapeHtml(note.context)}</span>` : ''}
                    </div>
                    ${note.tags.length ? `<div class="tags mb-3">${note.tags.map(t => this.tagChip(t, false)).join('')}</div>` : ''}
                    ${note.repetitionCount > 2 ? `
                        <div class="pattern-alert mb-2">
                            <div class="pattern-alert-title">${icon('arrows-clockwise')} Pattern detected</div>
                            You’ve captured something like this ${note.repetitionCount} times. Turn it into a decision?
                            <div><button class="btn btn-small btn-primary mt-1" onclick="app.createActionFromPattern('${note.id}')">Turn into action</button></div>
                        </div>` : ''}
                    <div class="markdown-preview">${note.contentHtml || this.markdownToHtml(note.contentMarkdown)}</div>
                    ${note.source ? `<p class="mt-2 text-muted"><strong>Source:</strong> ${/^https?:\/\//i.test(note.source) ? `<a href="${this.escapeHtml(note.source)}" target="_blank" rel="noopener">${this.escapeHtml(note.source)}</a>` : this.escapeHtml(note.source)}</p>` : ''}
                    ${linkedTo.length || linkedFrom.length ? `
                        <div class="note-links-section">
                            <h3>${icon('link')} Connected notes</h3>
                            ${linkedTo.length ? `<p class="text-muted mb-1" style="font-size:.85rem">Links to</p>${linkedTo.map(linkRow).join('')}` : ''}
                            ${linkedFrom.length ? `<p class="text-muted mb-1 mt-1" style="font-size:.85rem">Linked from</p>${linkedFrom.map(linkRow).join('')}` : ''}
                        </div>` : ''}
                    ${related.length ? `
                        <div class="related-notes">
                            <h3>${icon('puzzle-piece')} Related notes</h3>
                            <p class="text-muted mb-1" style="font-size:.85rem">Shared tags, projects and topics</p>
                            ${related.map(linkRow).join('')}
                        </div>` : ''}
                    <div class="modal-actions">
                        <button class="btn btn-danger btn-small" onclick="app.deleteNote('${note.id}')">${icon('trash')} Delete</button>
                        <span class="spacer"></span>
                        <button class="btn btn-outline btn-small" onclick="app.showLinkModal('${note.id}')">${icon('link')} Link</button>
                        <button class="btn btn-outline btn-small" onclick="app.exportNoteMarkdown('${note.id}')">${icon('export')} Export</button>
                        <button class="btn btn-outline btn-small" onclick="app.closeDetailModal(); app.showCaptureModal('${note.id}')">${icon('pencil-simple')} Edit</button>
                        ${note.status === 'unprocessed' ? `<button class="btn btn-primary btn-small" onclick="app.markProcessed('${note.id}', this)">${icon('check', 'bold')} Processed</button>` : ''}
                    </div>`;
                document.getElementById('detail-modal').classList.add('active');
            },
            closeDetailModal() { document.getElementById('detail-modal').classList.remove('active'); },

            showLinkModal(noteId) {
                this.state.currentNoteId = noteId;
                const note = this.state.notes.find(n => n.id === noteId);
                if (!note) return;
                const existing = note.linksTo || [];
                const others = this.state.notes.filter(n => n.id !== noteId);
                document.getElementById('link-content').innerHTML = `
                    <p class="text-muted mb-2">Pick notes to connect to “${this.escapeHtml(note.title)}”.</p>
                    <div style="max-height:50vh;overflow-y:auto">
                        ${others.length ? others.map(n => `
                            <label class="list-item check" style="cursor:pointer;--type:${typeMeta(n.type).color}">
                                <input type="checkbox" value="${n.id}" ${existing.includes(n.id) ? 'checked' : ''}>
                                <span style="flex:1">${icon(typeMeta(n.type).icon)} ${this.escapeHtml(n.title)}</span>
                            </label>`).join('') : '<p class="text-muted">No other notes yet.</p>'}
                    </div>`;
                document.getElementById('link-modal').classList.add('active');
            },
            closeLinkModal() { document.getElementById('link-modal').classList.remove('active'); },
            saveLinks() {
                const ids = [...document.querySelectorAll('#link-content input[type="checkbox"]:checked')].map(cb => cb.value);
                const note = this.state.notes.find(n => n.id === this.state.currentNoteId);
                if (!note) return;
                note.linksTo = ids;
                this.saveState();
                this.closeLinkModal();
                this.showNoteDetail(note.id);
                this.toast(ids.length ? `Linked to ${ids.length} note${ids.length > 1 ? 's' : ''}` : 'Links cleared', 'link', 'var(--c-violet)');
            },

            createActionFromPattern(noteId) {
                const note = this.state.notes.find(n => n.id === noteId);
                this.closeDetailModal();
                this.showCaptureModal(null, 'decision');
                if (note) { document.getElementById('note-title').value = `Action: ${note.title}`; note.tags.forEach(t => this.addTag(t)); }
            },

            renderTimelineView() {
                const sorted = [...this.state.notes].sort((a, b) => this.dayKey(b.dateCaptured).localeCompare(this.dayKey(a.dateCaptured)));
                if (!sorted.length) return this.viewHead('Your timeline', 'Every thought, in order.', 'watch') + this.emptyState('ladder', 'Nothing on the timeline yet', 'Your first capture is the first rung.');
                let month = '';
                return `
                    ${this.viewHead('Your timeline', 'Every thought, in order.', 'watch')}
                    <div class="timeline">
                        ${sorted.map(n => {
                            const mLabel = this.fmtDate(n.dateCaptured, { month: 'long', year: 'numeric' });
                            const head = mLabel !== month ? `<div class="timeline-month">${(month = mLabel)}</div>` : '';
                            return `${head}<div class="timeline-item" style="--type:${typeMeta(n.type).color}">
                                <div class="timeline-date">${this.fmtDate(n.dateCaptured, { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                                ${this.renderNoteCard(n)}</div>`;
                        }).join('')}
                    </div>`;
            },

            renderTagCloudView() {
                const counts = {};
                this.state.notes.forEach(n => n.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
                const tags = Object.entries(counts).sort((a, b) => b[1] - a[1]);
                if (!tags.length) return this.viewHead('Your tags', '', 'colorWheel') + this.emptyState('colorWheel', 'No tags yet', 'Tags help patterns jump out. Add a few when you capture.');
                const max = Math.max(...tags.map(t => t[1]));
                return `
                    ${this.viewHead('Your tags', 'Bigger = more notes. Tap one to see them all.', 'colorWheel')}
                    <div class="card"><div class="tag-cloud">
                        ${tags.map(([tag, c]) => `<span class="cloud-tag" style="--tc:${tagColor(tag)};font-size:${(0.9 + (c / max) * 1.1).toFixed(2)}rem" data-tag="${this.escapeHtml(tag)}" onclick="app.filterByTag(this.dataset.tag)">${this.escapeHtml(tag)} <small>${c}</small></span>`).join('')}
                    </div></div>`;
            },

            filterByTag(tag) {
                this.closeDetailModal();
                this.state.currentView = 'all';
                this.state.filters = { tag };
                this.state.searchQuery = '';
                this.renderNav();
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            filterByProject(project) {
                this.closeDetailModal();
                this.state.currentView = 'all';
                this.state.filters = { project };
                this.state.searchQuery = '';
                this.renderNav();
                this.render();
            },

            renderProjectsView() {
                const projects = {};
                this.state.notes.forEach(n => { if (n.project) (projects[n.project] = projects[n.project] || []).push(n); });
                const names = Object.keys(projects).sort();
                if (!names.length) return this.viewHead('Projects', '', 'cloudFolder') + this.emptyState('castle', 'No projects yet', 'Add a project under “More details” when you capture, and watch your thinking build up here.');
                return `
                    ${this.viewHead('Projects', 'See how your thinking evolved on each one.', 'cloudFolder')}
                    ${names.map(p => {
                        const notes = projects[p].sort((a, b) => this.dayKey(a.dateCaptured).localeCompare(this.dayKey(b.dateCaptured)));
                        const done = notes.filter(n => n.status === 'processed').length;
                        return `
                            <section class="project-section">
                                <div class="project-head">
                                    <div>
                                        <h3 class="project-section-title">${icon('folder-simple')} ${this.escapeHtml(p)}</h3>
                                        <p class="text-muted" style="font-size:.86rem">${notes.length} note${notes.length > 1 ? 's' : ''} · ${this.fmtDate(notes[0].dateCaptured)} → ${this.fmtDate(notes[notes.length - 1].dateCaptured)}</p>
                                    </div>
                                    <div title="${done} of ${notes.length} processed" style="display:flex;align-items:center;gap:.5rem;font-size:.82rem" class="text-muted">
                                        <div class="bar"><span style="width:${Math.round(done / notes.length * 100)}%"></span></div>${done}/${notes.length}
                                    </div>
                                </div>
                                ${notes.map(n => this.renderNoteCard(n)).join('')}
                            </section>`;
                    }).join('')}`;
            },

            renderReviewView() {
                const tiles = [
                    ['review-weekly', 'watch', 'This week', 'What you captured in the last 7 days', 'var(--c-sky)'],
                    ['review-monthly', 'sunCloud', 'This month', 'Themes and patterns from 30 days', 'var(--c-sun)'],
                    ['review-quarterly', 'rainbow', '3 months ago', 'What were you thinking about back then?', 'var(--c-pink)'],
                    ['review-random', 'dreamcatcher', 'Random note', 'Catch something you forgot', 'var(--c-mint)']
                ];
                return `
                    ${this.viewHead('Review & resurface', 'Your notes are only useful if you actually see them again.', 'brainOrbit')}
                    <div class="grid-tiles">
                        ${tiles.map(([v, a, t, s, c]) => `
                            <div class="card card-clickable review-tile" style="--pop:${c}" onclick="app.switchView('${v}')">
                                ${art(a)}<h3>${t}</h3><p class="text-muted" style="font-size:.9rem">${s}</p>
                            </div>`).join('')}
                    </div>`;
            },

            renderWeeklyReview() {
                const list = this.state.notes.filter(n => this.daysAgo(n.dateCaptured) <= 7).sort((a, b) => this.dayKey(b.dateCaptured).localeCompare(this.dayKey(a.dateCaptured)));
                return `
                    ${this.viewHead('This week’s captures', 'What your brain bumped into in the last 7 days.', 'watch', list.length ? ` <span class="hand">${list.length} notes!</span>` : '')}
                    ${this.backBtn('review', 'Back to review')}
                    ${list.length ? list.map(n => this.renderNoteCard(n)).join('') : this.emptyState('water', '', 'Nothing captured this week. That’s okay, life happens!', 'one tiny note counts →')}`;
            },

            renderMonthlyReview() {
                const month = this.state.notes.filter(n => this.daysAgo(n.dateCaptured) <= 30);
                const tagCounts = {}, typeCounts = {};
                month.forEach(n => { n.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }); typeCounts[n.type] = (typeCounts[n.type] || 0) + 1; });
                const topTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 12);
                const types = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]);
                const max = Math.max(1, ...types.map(t => t[1]));
                return `
                    ${this.viewHead('This month’s themes', 'Patterns from the last 30 days.', 'sunCloud')}
                    ${this.backBtn('review', 'Back to review')}
                    ${!month.length ? this.emptyState('moon', '', 'No notes in the last 30 days yet.') : `
                    <div class="grid-2">
                        <div class="card">
                            <h3 class="mb-2">${month.length} notes by type</h3>
                            ${types.map(([t, c]) => { const m = typeMeta(t); return `
                                <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.55rem">
                                    <span class="note-type" style="--type:${m.color};min-width:124px">${icon(m.icon)} ${this.escapeHtml(m.label)}</span>
                                    <div class="bar" style="flex:1;width:auto"><span style="width:${c / max * 100}%;background:${m.color}"></span></div>
                                    <strong style="min-width:1.5rem;text-align:right">${c}</strong>
                                </div>`; }).join('')}
                        </div>
                        <div class="card">
                            <h3 class="mb-2">Top tags</h3>
                            ${topTags.length ? `<div class="tags">${topTags.map(([t, c]) => `<span class="tag" style="--tc:${tagColor(t)}" data-tag="${this.escapeHtml(t)}" onclick="app.filterByTag(this.dataset.tag)">${this.escapeHtml(t)} · ${c}</span>`).join('')}</div>` : '<p class="text-muted">No tags this month.</p>'}
                        </div>
                    </div>`}`;
            },

            renderQuarterlyReview() {
                const list = this.state.notes.filter(n => { const d = this.daysAgo(n.dateCaptured); return d >= 90 && d <= 120; })
                    .sort((a, b) => this.dayKey(b.dateCaptured).localeCompare(this.dayKey(a.dateCaptured)));
                return `
                    ${this.viewHead('What you were thinking 3 months ago', 'Some insights need time to marinate.', 'rainbow')}
                    ${this.backBtn('review', 'Back to review')}
                    ${list.length ? list.map(n => this.renderNoteCard(n)).join('') : this.emptyState('airship', '', 'Nothing from that stretch yet.', 'check back in a few months')}`;
            },

            renderRandomNote() {
                if (!this.state.notes.length) return this.viewHead('Random resurface', '', 'dreamcatcher') + this.emptyState('dreamcatcher', 'No notes to catch yet', 'Capture a few and this will surprise you.');
                const pool = this.state.notes.length > 1 ? this.state.notes.filter(n => n.id !== this.state.lastRandomId) : this.state.notes;
                const n = pool[Math.floor(Math.random() * pool.length)];
                this.state.lastRandomId = n.id;
                const d = this.daysAgo(n.dateCaptured);
                return `
                    <div class="card" style="text-align:center;padding:1.5rem 1.5rem 1.75rem;background:linear-gradient(170deg, color-mix(in srgb, var(--c-mint) 16%, var(--surface)), var(--surface) 75%)">
                        ${art('dreamcatcher', 'float')}
                        <h2 class="mt-1">Random resurface</h2>
                        <p class="text-muted mt-1">From ${d === 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`}. Why might it still matter?</p>
                        <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap" class="mt-2">
                            <button class="btn btn-pop" onclick="app.switchView('review-random')">${icon('dice-five')} Roll again</button>
                            <button class="btn btn-outline" onclick="app.switchView('review')">${icon('arrow-left', 'bold')} Review</button>
                        </div>
                        <p class="text-muted mt-2" style="font-size:.8rem">Tip: press <span class="kbd">R</span> anywhere</p>
                    </div>
                    ${this.renderNoteCard(n)}`.replace('class="art float"', 'class="art float" style="width:120px;height:120px;margin:0 auto"');
            },

            renderReadingListView() {
                const items = this.state.lists.readingList;
                const done = items.filter(i => i.status === 'done').length;
                return `
                    ${this.viewHead('Reading list', 'Stuff to read. No judgment if it never happens.', 'journal', items.length ? ` <span class="hand">${done}/${items.length} read</span>` : '')}
                    <div class="card">
                        <div class="add-row">
                            <input type="text" id="reading-input" placeholder="Book, article, link…" onkeydown="if(event.key==='Enter') app.addToReadingList()" aria-label="Add to reading list">
                            <button class="btn btn-primary" onclick="app.addToReadingList()">${icon('plus', 'bold')} Add</button>
                        </div>
                    </div>
                    ${!items.length ? this.emptyState('candle', '', 'Your reading list is empty.', 'add something you’ll (probably) read') : items.map((item, i) => `
                        <div class="list-item ${item.status === 'done' ? 'done' : ''}">
                            <label class="list-item-content check" style="margin:0">
                                <input type="checkbox" ${item.status === 'done' ? 'checked' : ''} onchange="app.toggleReadingStatus(${i}, this)">
                                <span class="list-title">${this.escapeHtml(item.title)}</span>
                            </label>
                            <div class="list-item-actions">
                                ${item.status === 'done' ? `<button class="btn btn-small btn-outline" onclick="app.createNoteFromReading(${i})">${icon('note')} Make a note</button>` : ''}
                                <button class="btn btn-small btn-ghost" onclick="app.removeFromReadingList(${i})" aria-label="Remove">${icon('x', 'bold')}</button>
                            </div>
                        </div>`).join('')}`;
            },

            renderSomedayView() {
                const items = this.state.lists.somedayMaybe;
                return `
                    ${this.viewHead('Someday / maybe', 'Ideas that might be good… someday. Or never. Both are fine.', 'airship')}
                    <div class="card">
                        <div class="add-row">
                            <input type="text" id="someday-input" placeholder="Something for later…" onkeydown="if(event.key==='Enter') app.addToSomedayList()" aria-label="Add someday idea">
                            <button class="btn btn-primary" onclick="app.addToSomedayList()">${icon('plus', 'bold')} Add</button>
                        </div>
                    </div>
                    ${!items.length ? this.emptyState('cloud', '', 'Nothing parked up here yet.', 'the perfect home for half-baked ideas') : items.map((item, i) => `
                        <div class="list-item">
                            <div class="list-item-content">
                                <div class="list-title">${this.escapeHtml(item.title)}</div>
                                <div class="text-muted" style="font-size:.8rem">Parked ${this.relDate(item.addedDate.slice(0, 10))}</div>
                            </div>
                            <div class="list-item-actions">
                                <button class="btn btn-small btn-outline" onclick="app.moveToNote(${i})">${icon('rocket-launch')} Make it a note</button>
                                <button class="btn btn-small btn-ghost" onclick="app.removeFromSomedayList(${i})" aria-label="Remove">${icon('x', 'bold')}</button>
                            </div>
                        </div>`).join('')}`;
            },

            renderSettingsView() {
                const s = this.state.settings;
                const n = s.notion;
                const types = ['idea', 'learning', 'insight', 'decision', 'book', 'meeting', 'voice', 'reference'];
                return `
                    ${this.viewHead('Settings', 'Make it yours.', 'gear')}
                    <div class="settings-grid">
                        <div class="card"><h3>${art('api')} Notion sync</h3>${this.renderNotionSettings()}</div>
                        <div class="card">
                            <h3>${art('colorWheel')} Look &amp; feel</h3>
                            <div class="form-group">
                                <label for="set-name">What should I call you?</label>
                                <input type="text" id="set-name" value="${this.escapeHtml(s.name)}" placeholder="Your name" onchange="app.updateSetting('name', this.value.trim())">
                            </div>
                            <div class="form-group">
                                <label>Theme</label>
                                <div class="seg">
                                    ${[['light', 'sun', 'Light'], ['dark', 'moon', 'Dark'], ['system', 'monitor', 'System']].map(([t, ic, l]) => `<button class="${s.theme === t ? 'active' : ''}" onclick="app.setTheme('${t}')">${icon(ic)} ${l}</button>`).join('')}
                                </div>
                            </div>
                            <label class="check mb-2"><input type="checkbox" ${s.showDailyCapture ? 'checked' : ''} onchange="app.updateSetting('showDailyCapture', this.checked)"> Show the daily prompt on Home</label>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="default-type">Default note type</label>
                                    <select id="default-type" onchange="app.updateSetting('defaultType', this.value)">
                                        ${types.map(t => `<option value="${t}" ${s.defaultType === t ? 'selected' : ''}>${typeMeta(t).label}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="default-area">Default area</label>
                                    <select id="default-area" onchange="app.updateSetting('defaultArea', this.value)">
                                        ${[['', 'None'], ['business', 'Business'], ['personal', 'Personal'], ['creative', 'Creative'], ['other', 'Other']].map(([v, l]) => `<option value="${v}" ${s.defaultArea === v ? 'selected' : ''}>${l}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <h3>${art('tablet')} Shortcuts</h3>
                            <div class="shortcut-list">
                                <span class="kbd">N</span><span>New note</span>
                                <span class="kbd">/</span><span>Search</span>
                                <span class="kbd">R</span><span>Random note</span>
                                <span><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span></span><span>Save note</span>
                                <span class="kbd">Esc</span><span>Close a window</span>
                            </div>
                        </div>
                        <div class="card">
                            <h3>${art('cloudFolder')} Your data</h3>
                            <p class="mb-2" style="font-size:.93rem"><strong>${this.state.notes.length}</strong> notes · <strong>${this.state.lists.readingList.length}</strong> reading · <strong>${this.state.lists.somedayMaybe.length}</strong> someday</p>
                            <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                                <button class="btn btn-outline btn-small" onclick="app.exportAllJSON()">${icon('download-simple')} Export JSON</button>
                                <button class="btn btn-outline btn-small" onclick="app.showImportModal()">${icon('upload-simple')} Import</button>
                                <button class="btn btn-danger btn-small" onclick="app.clearAllData()">${icon('trash')} Clear this device</button>
                            </div>
                            <p class="text-muted mt-2" style="font-size:.83rem">${n.enabled ? 'Notes live in Notion. Reading and Someday lists, links between notes, and settings stay on this device.' : 'Everything is stored in this browser. Export now and then as a backup.'}</p>
                            <p class="credit mt-2">3D art: creativeproduction.rrgraph on Creative Fabrica. Icons: Phosphor.</p>
                        </div>
                    </div>`;
            },

            renderNotionSettings() {
                const n = this.state.settings.notion;
                if (n.enabled) {
                    const err = this.sync.error;
                    return `
                        <div class="notion-status">${icon('cloud-check')}
                            <div style="min-width:0"><strong>Connected${n.databaseTitle ? ` to ${this.escapeHtml(n.databaseTitle)}` : ''}</strong>
                            <div class="text-muted" style="font-size:.85rem">${n.lastSync ? `Last synced ${new Date(n.lastSync).toLocaleString()}` : 'Not synced yet'}</div></div>
                        </div>
                        ${err ? `<div class="notion-error"><strong>Last sync failed:</strong> ${this.escapeHtml(err)}</div>` : ''}
                        <p class="text-muted mb-2" style="font-size:.88rem">New notes, edits, stars and “processed” save to Notion automatically. Changes made in Notion show up here every few minutes.</p>
                        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                            <button class="btn btn-primary btn-small" onclick="app.syncNow()" ${this.sync.busy ? 'disabled' : ''}>${icon('arrows-clockwise')} Sync now</button>
                            ${this.sync.serverToken ? '' : `<button class="btn btn-outline btn-small" onclick="app.disconnectNotion()">${icon('plugs')} Disconnect</button>`}
                            ${this.sync.locked ? `<a class="btn btn-outline btn-small" href="/logout">${icon('lock-simple')} Lock app</a>` : ''}
                        </div>
                        ${this.sync.serverToken ? `<p class="text-muted mt-2" style="font-size:.8rem">${icon('shield-check')} Your Notion token is stored on the server, not in this browser.</p>` : ''}`;
                }
                const choices = this.sync.dbChoices;
                return `
                    <div class="notion-status off">${icon('cloud-slash')}
                        <div><strong>Not connected</strong><div class="text-muted" style="font-size:.85rem">Notes are saved on this device only.</div></div>
                    </div>
                    <div class="form-group">
                        <label for="notion-token">Notion integration token</label>
                        <input type="password" id="notion-token" placeholder="${this.sync.serverToken ? 'Using the token in .env (leave blank)' : 'ntn_…'}" autocomplete="off">
                        <p class="text-muted mt-1" style="font-size:.8rem">From <a href="https://www.notion.so/my-integrations" target="_blank" rel="noopener">notion.so/my-integrations</a>. Share your database with it under <em>Content access</em>. Stored in this browser only.</p>
                    </div>
                    ${choices ? `<div class="form-group"><label for="notion-db">Which database is your knowledge base?</label><select id="notion-db">${choices.map(d => `<option value="${d.id}">${this.escapeHtml(d.title)}</option>`).join('')}</select></div>` : ''}
                    <div id="notion-connect-error"></div>
                    <button class="btn btn-primary" id="notion-connect-btn" onclick="app.connectNotion()">${icon('plugs-connected')} Connect &amp; sync</button>`;
            },

            updateSetting(key, value) {
                this.state.settings[key] = value;
                this.saveState();
                if (key === 'showDailyCapture') this.toast(value ? 'Daily prompt is back' : 'Daily prompt hidden', 'check-circle', 'var(--c-sky)');
                if (key === 'name' && value) this.toast(`Nice to meet you, ${value}!`, 'hand-waving', 'var(--c-sun)');
            },

            clearAllData() {
                const notion = this.state.settings.notion.enabled;
                if (!confirm(notion ? 'Clear everything stored on this device? Your notes in Notion are NOT touched, but Reading/Someday lists and links will be lost.' : 'Delete EVERYTHING on this device? Export first if you want a backup!')) return;
                if (!notion && !confirm('Seriously? All your notes will be gone forever.')) return;
                ['pkb_notes', 'pkb_lists', 'pkb_settings', 'pkb_pending_deletes', 'pkb-settings', 'pkb-notes', 'pkb-lists'].forEach(k => localStorage.removeItem(k));
                location.reload();
            },

            /* ---------- Reading & Someday ---------- */
            addToReadingList() {
                const input = document.getElementById('reading-input');
                if (!input.value.trim()) return;
                this.state.lists.readingList.push({ id: this.generateId(), title: input.value.trim(), status: 'to-read', addedDate: new Date().toISOString() });
                this.saveState(); this.renderNav(); this.render();
                document.getElementById('reading-input')?.focus();
                this.toast('Added to the pile', 'books', 'var(--c-coral)');
            },
            toggleReadingStatus(i, el) {
                const item = this.state.lists.readingList[i];
                item.status = item.status === 'done' ? 'to-read' : 'done';
                this.saveState();
                if (item.status === 'done') { this.confetti(40, el); this.toast('Finished! Want to capture what stuck?', 'book-open', 'var(--c-mint)'); }
                this.renderNav(); this.render();
            },
            removeFromReadingList(i) { this.state.lists.readingList.splice(i, 1); this.saveState(); this.renderNav(); this.render(); },
            createNoteFromReading(i) {
                const item = this.state.lists.readingList[i];
                this.showCaptureModal(null, 'book');
                document.getElementById('note-title').value = `Notes: ${item.title}`;
                if (/^https?:\/\//i.test(item.title)) document.getElementById('note-source').value = item.title;
            },
            addToSomedayList() {
                const input = document.getElementById('someday-input');
                if (!input.value.trim()) return;
                this.state.lists.somedayMaybe.push({ id: this.generateId(), title: input.value.trim(), addedDate: new Date().toISOString() });
                this.saveState(); this.renderNav(); this.render();
                document.getElementById('someday-input')?.focus();
                this.toast('Parked for someday', 'cloud', 'var(--c-lavender)');
            },
            removeFromSomedayList(i) { this.state.lists.somedayMaybe.splice(i, 1); this.saveState(); this.renderNav(); this.render(); },
            moveToNote(i) {
                const item = this.state.lists.somedayMaybe[i];
                this.showCaptureModal(null, 'idea');
                document.getElementById('note-title').value = item.title;
                this.removeFromSomedayList(i);
            },

            /* ---------- Import / export ---------- */
            showImportModal() {
                document.body.insertAdjacentHTML('beforeend', `
                    <div id="import-modal-temp" class="modal active" onclick="if(event.target===this) this.remove()">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h2 class="modal-title">Import notes</h2>
                                <button class="modal-close" onclick="document.getElementById('import-modal-temp').remove()" aria-label="Close">${icon('x', 'bold')}</button>
                            </div>
                            <div class="form-group"><label for="import-file">JSON backup file</label><input type="file" id="import-file" accept=".json"></div>
                            <label class="check mb-1"><input type="radio" name="import-mode" value="merge" checked> Merge with existing notes</label>
                            <label class="check"><input type="radio" name="import-mode" value="replace"> Replace everything on this device</label>
                            ${this.state.settings.notion.enabled ? '<p class="text-muted mt-2" style="font-size:.85rem">Imported notes will also be added to Notion on the next sync.</p>' : ''}
                            <div class="modal-actions">
                                <button class="btn btn-outline" onclick="document.getElementById('import-modal-temp').remove()">Cancel</button>
                                <button class="btn btn-primary" onclick="app.importJSON()">${icon('upload-simple')} Import</button>
                            </div>
                        </div>
                    </div>`);
            },
            exportAllJSON() {
                const data = { notes: this.state.notes, lists: this.state.lists, exportDate: new Date().toISOString(), version: '3.0' };
                this.download(`brain-backup-${this.todayKey()}.json`, JSON.stringify(data, null, 2), 'application/json');
                this.toast('Backup downloaded', 'download-simple', 'var(--c-mint)');
            },
            exportNoteMarkdown(noteId) {
                const n = this.state.notes.find(x => x.id === noteId);
                if (!n) return;
                const md = `# ${n.title}\n\n**Type:** ${n.type}\n**Tags:** ${n.tags.join(', ')}\n${n.project ? `**Project:** ${n.project}  \n` : ''}${n.goal ? `**Goal:** ${n.goal}  \n` : ''}**Date:** ${this.fmtDate(n.dateCaptured)}\n\n---\n\n${n.contentMarkdown}\n`;
                this.download(`${n.title.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.md`, md, 'text/markdown');
            },
            download(name, text, type) {
                const url = URL.createObjectURL(new Blob([text], { type }));
                const a = Object.assign(document.createElement('a'), { href: url, download: name });
                a.click();
                URL.revokeObjectURL(url);
            },
            importJSON() {
                const file = document.getElementById('import-file')?.files[0];
                const mode = document.querySelector('input[name="import-mode"]:checked')?.value || 'merge';
                if (!file) { this.toast('Pick a file first', 'file-dashed', 'var(--c-pink)'); return; }
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const data = JSON.parse(e.target.result);
                        // Imported notes are new to this database: drop old Notion IDs so they get created
                        const notes = (data.notes || []).map(n => ({ ...n, tags: n.tags || [], linksTo: n.linksTo || [], contentMarkdown: n.contentMarkdown || '', contentHtml: this.markdownToHtml(n.contentMarkdown || ''), notionId: undefined, dirty: true, sample: false }));
                        if (mode === 'replace') {
                            this.state.notes = notes;
                            this.state.lists = { readingList: [], somedayMaybe: [], ...(data.lists || {}) };
                        } else {
                            const ids = new Set(this.state.notes.map(n => n.id));
                            this.state.notes = [...this.state.notes, ...notes.filter(n => !ids.has(n.id))];
                            if (data.lists) {
                                this.state.lists.readingList.push(...(data.lists.readingList || []));
                                this.state.lists.somedayMaybe.push(...(data.lists.somedayMaybe || []));
                            }
                        }
                        this.saveState();
                        document.getElementById('import-modal-temp')?.remove();
                        this.renderNav(); this.render();
                        this.confetti(80);
                        this.toast(`Imported ${notes.length} notes. Welcome back!`, 'upload-simple', 'var(--c-mint)');
                        if (this.sync.api) this.syncNow();
                    } catch (error) {
                        this.toast('Couldn’t read that file: ' + error.message, 'warning', 'var(--c-pink)', 5000);
                    }
                };
                reader.readAsText(file);
            },

            /* =====================================================
               Notion sync
               ===================================================== */
            async checkServer() {
                try {
                    const data = await (await fetch('/api/status', { cache: 'no-store' })).json();
                    this.sync.serverToken = data.serverToken === true;
                    this.sync.locked = data.locked === true;
                    if (this.state.currentView === 'settings' && !this.state.settings.notion.enabled) this.render();
                } catch { /* opened as a file or server down */ }
            },

            setSyncStatus(state, label) {
                const text = { local: 'On this device', syncing: 'Syncing…', synced: 'Synced with Notion', error: 'Sync issue' }[state];
                const icons = { local: 'cloud', syncing: 'arrows-clockwise', synced: 'cloud-check', error: 'warning' };
                const pill = document.getElementById('sync-pill');
                pill.dataset.state = state;
                document.getElementById('sync-icon').className = `ph-duotone ph-${icons[state]}`;
                document.getElementById('sync-label').textContent = label || text;
                pill.title = label || text;
            },

            startAutoSync() {
                clearInterval(this.sync.timer);
                this.sync.timer = setInterval(() => this.syncNow({ quiet: true }), 5 * 60 * 1000);
            },

            async connectNotion() {
                const errBox = document.getElementById('notion-connect-error');
                const btn = document.getElementById('notion-connect-btn');
                const token = (document.getElementById('notion-token')?.value || '').trim() || this.state.settings.notion.token || '';
                const picked = document.getElementById('notion-db')?.value;
                const showErr = msg => { errBox.innerHTML = `<div class="notion-error">${msg}</div>`; };
                errBox.innerHTML = '';
                if (!token && !this.sync.serverToken) { showErr('Paste your Notion integration token first.'); return; }
                btn.disabled = true;
                btn.textContent = 'Connecting…';
                try {
                    const api = new NotionAPI(token);
                    let databaseId = picked;
                    if (!databaseId) {
                        const dbs = await api.listDatabases();
                        if (dbs.length === 0) throw Object.assign(new Error('Your token works, but no databases are shared with it yet.'), { hint: 'In Notion, open notion.so/my-integrations → your integration → <strong>Content access</strong> → Edit access → tick your knowledge base database → Save. Then try again.' });
                        if (dbs.length > 1) {
                            this.state.settings.notion.token = token;
                            this.sync.dbChoices = dbs;
                            this.render();
                            const known = dbs.find(d => d.id.replace(/-/g, '') === NOTION_DEFAULTS.DATABASE_ID.replace(/-/g, ''));
                            if (known) document.getElementById('notion-db').value = known.id;
                            this.toast('Pick your knowledge base database', 'hand-pointing', 'var(--c-sky)');
                            return;
                        }
                        databaseId = dbs[0].id;
                    }
                    api.databaseId = databaseId;
                    const db = await api.getDatabase();
                    const title = db.title?.map(t => t.plain_text).join('') || 'your database';
                    this.state.settings.notion = { token, databaseId, databaseTitle: title, enabled: true, lastSync: null };
                    this.state.notes = this.state.notes.filter(n => !n.sample);
                    this.sync.api = api;
                    this.sync.dbChoices = null;
                    this.saveState();
                    await this.syncNow({ quiet: true });
                    this.startAutoSync();
                    this.confetti(120);
                    this.toast(`Connected to ${title}!`, 'plugs-connected', 'var(--c-mint)', 3500);
                    this.renderNav();
                    this.render();
                } catch (error) {
                    const hints = { 401: 'The token was rejected. Copy it again from notion.so/my-integrations.', 404: 'Notion can’t see that database. Share it with your integration under <strong>Content access</strong>.' };
                    showErr(`<strong>Couldn’t connect:</strong> ${this.escapeHtml(error.message)}${error.hint ? `<br>${error.hint}` : hints[error.status] ? `<br>${hints[error.status]}` : ''}`);
                } finally {
                    const b = document.getElementById('notion-connect-btn');
                    if (b) { b.disabled = false; b.innerHTML = `${icon('plugs-connected')} Connect &amp; sync`; }
                }
            },

            disconnectNotion() {
                if (!confirm('Disconnect from Notion? Your notes stay in Notion, and a copy stays on this device.')) return;
                clearInterval(this.sync.timer);
                this.sync.api = null;
                this.sync.error = null;
                this.state.settings.notion = { token: '', databaseId: '', databaseTitle: '', enabled: false, lastSync: null };
                localStorage.removeItem('pkb-settings');
                this.saveState();
                this.setSyncStatus('local');
                this.render();
                this.toast('Disconnected from Notion', 'plugs', 'var(--c-slate)');
            },

            // All Notion writes run one at a time, so a quick star-then-process can't land out of order.
            // A note already waiting in the queue isn't queued twice: when its turn comes it sends its latest state.
            enqueue(task) {
                this.sync.chain = this.sync.chain.then(task, task);
                return this.sync.chain;
            },

            pushNote(note) {
                if (!this.sync.api || note.sample) return;
                if (this.sync.queued.has(note.id)) return;
                this.sync.queued.add(note.id);
                return this.enqueue(() => {
                    this.sync.queued.delete(note.id);
                    if (!this.state.notes.includes(note)) return; // deleted while waiting
                    return this.pushNow(note);
                });
            },

            // If it fails the note stays "dirty" and goes up on the next sync
            async pushNow(note) {
                try {
                    this.setSyncStatus('syncing');
                    if (note.notionId) await this.sync.api.updatePage(note.notionId, note);
                    else note.notionId = (await this.sync.api.createPage(note)).id;
                    note.dirty = false;
                    this.sync.error = null;
                    this.saveState();
                    this.setSyncStatus('synced', 'Saved to Notion');
                    document.querySelectorAll(`.favorite-star[data-id="${note.id}"]`).forEach(s => s.closest('.note-card')?.querySelector('.chip-unsynced')?.remove());
                } catch (error) {
                    console.error('Push failed:', error);
                    this.sync.error = error.message;
                    this.setSyncStatus('error', 'Not saved to Notion');
                    this.toast('Saved here, but not in Notion yet. Will retry.', 'warning', 'var(--c-pink)', 4000);
                }
            },

            async flushDeletes() {
                if (!this.sync.api) return;
                const remaining = [];
                for (const id of this.state.pendingDeletes) {
                    try { await this.sync.api.archivePage(id); }
                    catch (e) { if (e.status !== 404 && e.status !== 400) remaining.push(id); }
                }
                this.state.pendingDeletes = remaining;
                this.saveState();
            },

            syncNow(opts) {
                if (!this.sync.api || this.sync.busy) return;
                this.sync.busy = true;
                return this.enqueue(() => this.runSync(opts));
            },

            async runSync({ quiet = false } = {}) {
                this.sync.lastAttempt = Date.now();
                this.setSyncStatus('syncing');
                try {
                    // 1. Send anything not yet in Notion
                    for (const note of this.state.notes.filter(n => (n.dirty || !n.notionId) && !n.sample)) {
                        if (note.notionId) await this.sync.api.updatePage(note.notionId, note);
                        else note.notionId = (await this.sync.api.createPage(note)).id;
                        note.dirty = false;
                    }
                    await this.flushDeletes();
                    if (!this.state.settings.notion.databaseTitle) {
                        const db = await this.sync.api.getDatabase();
                        this.state.settings.notion.databaseTitle = db.title?.map(t => t.plain_text).join('') || '';
                    }

                    // 2. Pull Notion as the source of truth, keeping local-only extras (links)
                    const pages = await this.sync.api.queryAll();
                    const byNotion = new Map(this.state.notes.filter(n => n.notionId).map(n => [n.notionId, n]));
                    const createdMeanwhile = this.state.notes.filter(n => !n.notionId && !n.sample); // not in Notion's list yet
                    const merged = pages.map(page => {
                        const remote = this.sync.api.fromPage(page);
                        const local = byNotion.get(remote.notionId);
                        if (local?.dirty) return local; // edited here while the pull was in flight
                        return { ...remote, id: local?.id || remote.id, linksTo: local?.linksTo || [], patternFlags: local?.patternFlags || [], contentHtml: this.markdownToHtml(remote.contentMarkdown) };
                    });
                    merged.push(...createdMeanwhile);
                    merged.sort((a, b) => this.dayKey(b.dateCaptured).localeCompare(this.dayKey(a.dateCaptured)) || (b.lastUpdated || '').localeCompare(a.lastUpdated || ''));
                    const ids = new Set(merged.map(n => n.id));
                    merged.forEach(n => { n.linksTo = (n.linksTo || []).filter(id => ids.has(id)); });
                    this.state.notes = merged;
                    // Notes that arrive from Notion count toward badges quietly (only in-app captures celebrate)
                    const reached = BADGES.filter(b => merged.length >= b.at).pop()?.at || 0;
                    if (reached > (this.state.settings.lastMilestone || 0)) this.state.settings.lastMilestone = reached;
                    this.state.settings.notion.lastSync = new Date().toISOString();
                    this.sync.error = null;
                    this.saveState();

                    this.setSyncStatus('synced', `Synced ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
                    if (!document.querySelector('.modal.active')) { this.renderNav(); this.render(); } // don't yank an open editor
                    if (!quiet) this.toast(`Synced ${merged.length} note${merged.length === 1 ? '' : 's'} with Notion`, 'cloud-check', 'var(--c-mint)');
                } catch (error) {
                    console.error('Sync failed:', error);
                    this.sync.error = error.message;
                    this.saveState();
                    this.setSyncStatus('error');
                    if (!quiet) this.toast('Sync failed: ' + error.message, 'warning', 'var(--c-pink)', 5000);
                    if (this.state.currentView === 'settings') this.render();
                } finally {
                    this.sync.busy = false;
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
